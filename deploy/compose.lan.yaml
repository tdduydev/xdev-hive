# A LAN port for the same hub, over plain HTTP (roadmap 43): machines on the office network reach it
# directly, without the public hostname. From the repo root:
#   HIVE_LAN=1 bash deploy/update.sh      (with HIVE_LAN_HOSTS in deploy/.env)
# Goes with compose.yaml, next to the public Caddy or a Cloudflare Tunnel (HIVE_TUNNEL=1 HIVE_LAN=1), or
# on its own: a hub only on the LAN needs no domain, leave HIVE_HOSTNAME out and never start the caddy service.
#   HIVE_LAN_HOSTS=10.86.140.52,my-server   names and addresses a browser may use (no port, no scheme)
#   HIVE_LAN_PORT=7780                      port on the machine
#   HIVE_LAN_BIND=0.0.0.0                   interface to publish on, e.g. 10.86.140.52 for that network only
# Tokens and passwords travel unencrypted on this port: keep it on a trusted network (see README).
services:
  hub:
    environment:
      # Added to HIVE_ALLOWED_HOSTS, which keeps the public hostname first (the hub's own URL).
      HIVE_LAN_HOSTS: ${HIVE_LAN_HOSTS:?set HIVE_LAN_HOSTS, e.g. 10.86.140.52,my-server}

  lan:
    image: caddy:2
    restart: unless-stopped
    depends_on: [hub]
    ports:
      - "${HIVE_LAN_BIND:-0.0.0.0}:${HIVE_LAN_PORT:-7780}:7780"
    volumes:
      - ./Caddyfile.lan:/etc/caddy/Caddyfile:ro
