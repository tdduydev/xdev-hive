# A LAN port for the same hub, over HTTPS with an internal CA (roadmap 43, OPS-lan-https): machines on the office network reach it
# directly, without the public hostname. From the repo root:
#   HIVE_LAN=1 bash deploy/update.sh      (with HIVE_LAN_HOSTS in deploy/.env)
# Goes with compose.yaml, next to the public Caddy or a Cloudflare Tunnel (HIVE_TUNNEL=1 HIVE_LAN=1), or
# on its own: a hub only on the LAN needs no domain, leave HIVE_HOSTNAME out and never start the caddy service.
#   HIVE_LAN_HOSTS=192.0.2.52,my-server   names and addresses a browser may use (no port, no scheme)
#   HIVE_LAN_HTTPS_PORT=7743                HTTPS port on the machine (the one to use)
#   HIVE_LAN_PORT=7780                      the old plain port: sends browser pages to HTTPS, still serves /api until machines switch
#   HIVE_LAN_HTTP_REDIRECT=1                0: no redirect on the plain port
#   HIVE_LAN_BIND=0.0.0.0                   interface to publish on, e.g. 192.0.2.52 for that network only
# The CA lives in the lan-caddy-data volume: delete it and every machine must trust the new root (docs/deployment/lan-https.md).
services:
  hub:
    environment:
      # Added to HIVE_ALLOWED_HOSTS, which keeps the public hostname first (the hub's own URL).
      HIVE_LAN_HOSTS: ${HIVE_LAN_HOSTS:?set HIVE_LAN_HOSTS, e.g. 192.0.2.52,my-server}
      # Told to machines on /api/me, so one with http:// saved can move to https://<same host>:<port>.
      HIVE_LAN_HTTPS_PORT: ${HIVE_LAN_HTTPS_PORT:-7743}

  lan:
    image: ${HIVE_CADDY_IMAGE:-ghcr.io/tdduydev/xdev-hive-caddy:2.11.7}
    restart: unless-stopped
    depends_on: [hub]
    entrypoint: ["/bin/sh", "/etc/caddy/lan-entrypoint.sh"]
    environment:
      HIVE_LAN_HOSTS: ${HIVE_LAN_HOSTS}
      HIVE_LAN_HTTPS_PORT: ${HIVE_LAN_HTTPS_PORT:-7743}
      HIVE_LAN_HTTP_REDIRECT: ${HIVE_LAN_HTTP_REDIRECT:-1}
    ports:
      - "${HIVE_LAN_BIND:-0.0.0.0}:${HIVE_LAN_HTTPS_PORT:-7743}:7743"
      - "${HIVE_LAN_BIND:-0.0.0.0}:${HIVE_LAN_PORT:-7780}:7780"
    volumes:
      - ./Caddyfile.lan:/etc/caddy/Caddyfile:ro
      - ./lan-entrypoint.sh:/etc/caddy/lan-entrypoint.sh:ro
      # Root CA and its key: a new volume would be a new CA that every machine has to trust again.
      - lan-caddy-data:/data

volumes:
  lan-caddy-data:
