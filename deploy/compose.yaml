# Hub behind Caddy (automatic HTTPS). From the repo root:
#   HIVE_HOSTNAME=hive.example.com docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml logs hub    # first start prints the admin's temporary password
# Behind a Cloudflare Tunnel instead of Caddy: see compose.tunnel.yaml. A port for the LAN too: compose.lan.yaml.
# DNS for HIVE_HOSTNAME must point here and ports 80/443 must be reachable for the certificate.
# Memory search by meaning: COMPOSE_PROFILES=embed and HIVE_EMBED_URL=http://ollama:11434/v1 in deploy/.env
# start Ollama below (deploy/update.sh pulls HIVE_EMBED_MODEL, default bge-m3). Any OpenAI-compatible
# /embeddings endpoint works too: HIVE_EMBED_URL + HIVE_EMBED_MODEL (+ HIVE_EMBED_KEY), without the profile.
# Doc images and files are kept in SeaweedFS below (roadmap 23c); HIVE_SEAWEEDFS_URL= (empty) keeps them in the database.
services:
  hub:
    build: ..
    restart: unless-stopped
    environment:
      # The public hostname. Empty only for a hub that lives on the LAN alone (compose.lan.yaml adds its
      # names in HIVE_LAN_HOSTS): compose reads this file before any override, so a required variable here
      # would make that deploy impossible. deploy/update.sh asks for the hostname when there is no LAN port.
      HIVE_ALLOWED_HOSTS: ${HIVE_HOSTNAME:-}
      HIVE_BOOTSTRAP_TOKEN: ${HIVE_BOOTSTRAP_TOKEN:-}
      # Caddy terminates TLS: Secure session cookies, client address for sign-in throttling.
      HIVE_TRUST_PROXY: "1"
      HIVE_MEMORY_APPROVAL: ${HIVE_MEMORY_APPROVAL:-on}
      HIVE_MEMORY_STALE_DAYS: ${HIVE_MEMORY_STALE_DAYS:-90}
      HIVE_BACKUP_HOURS: ${HIVE_BACKUP_HOURS:-24}
      HIVE_BACKUP_KEEP: ${HIVE_BACKUP_KEEP:-7}
      # The commit the hub was built from, for its Hub page (deploy/update.sh sets it).
      HIVE_COMMIT: ${HIVE_COMMIT:-}
      HIVE_EMBED_URL: ${HIVE_EMBED_URL:-}
      HIVE_EMBED_MODEL: ${HIVE_EMBED_MODEL:-bge-m3}
      HIVE_EMBED_KEY: ${HIVE_EMBED_KEY:-}
      HIVE_EMBED_MIN_SCORE: ${HIVE_EMBED_MIN_SCORE:-0.5}
      # Sign-in through an OpenID Connect provider (see README): all three of issuer, id and secret, or none.
      HIVE_PUBLIC_URL: ${HIVE_PUBLIC_URL:-}
      HIVE_OIDC_ISSUER: ${HIVE_OIDC_ISSUER:-}
      HIVE_OIDC_CLIENT_ID: ${HIVE_OIDC_CLIENT_ID:-}
      HIVE_OIDC_CLIENT_SECRET: ${HIVE_OIDC_CLIENT_SECRET:-}
      HIVE_OIDC_NAME: ${HIVE_OIDC_NAME:-}
      HIVE_OIDC_SCOPES: ${HIVE_OIDC_SCOPES:-}
      # Unset: the SeaweedFS below. Files already in the database move there; backups copy them to /data/backups/files.
      HIVE_SEAWEEDFS_URL: ${HIVE_SEAWEEDFS_URL-http://seaweedfs:8888}
      # Remote terminal (spec 69): off unless HIVE_REMOTE_TERMINAL=1 in deploy/.env. Machines connect over https only.
      HIVE_REMOTE_TERMINAL: ${HIVE_REMOTE_TERMINAL:-}
    depends_on: [seaweedfs]
    volumes:
      - hive-data:/data
      # Snapshots on a different disk than the database survive losing it. Default: same volume.
      - ${HIVE_BACKUP_PATH:-hive-backups}:/data/backups
    expose:
      - "7788"

  # Doc images and files (roadmap 23c): master, volume server and filer in one process. Only the hub reaches it, on this
  # compose network (nothing is published); the hub uses the filer's HTTP API on 8888.
  seaweedfs:
    image: ${HIVE_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.48}
    restart: unless-stopped
    command: server -dir=/data -filer -ip=127.0.0.1 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0
    volumes:
      - seaweedfs-data:/data
    expose:
      - "8888"
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:8888/"]
      interval: 10s
      timeout: 3s
      retries: 12

  # Embeddings on this machine (profile "embed"): only the hub reaches it, nothing is published.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: [embed]
    environment:
      # Keep the model loaded between searches (Ollama's default unloads it after 5 minutes).
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [hub]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddy's site address: this service only makes sense with a public hostname, so never start it without one.
      HIVE_HOSTNAME: ${HIVE_HOSTNAME:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  hive-data:
  hive-backups:
  seaweedfs-data:
  caddy-data:
  ollama-data:
