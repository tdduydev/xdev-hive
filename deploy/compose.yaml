name: xdev-hive
services:
  postgres:
    image: ${HIVE_POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg18-trixie}
    restart: unless-stopped
    environment:
      POSTGRES_DB: hive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HIVE_DB_ADMIN_PASSWORD:?Set HIVE_DB_ADMIN_PASSWORD}
    volumes:
      - hive-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hive"]
      interval: 5s
      timeout: 3s
      retries: 20
  hub:
    build:
      context: ..
      args:
        NODE_IMAGE: ${HIVE_NODE_IMAGE:-node:24.21-bookworm-slim}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HIVE_PORT: 3000
      # deploy/remote.sh đặt commit đang chạy để /api/v1/health báo đúng bản.
      HIVE_VERSION: ${HIVE_VERSION:-}
      HIVE_DATABASE_ADMIN_URL: postgres://postgres:${HIVE_DB_ADMIN_PASSWORD}@postgres:5432/hive
      HIVE_DB_OWNER_PASSWORD: ${HIVE_DB_OWNER_PASSWORD:?Set HIVE_DB_OWNER_PASSWORD}
      HIVE_DB_APP_PASSWORD: ${HIVE_DB_APP_PASSWORD:?Set HIVE_DB_APP_PASSWORD}
      HIVE_DB_AUTH_PASSWORD: ${HIVE_DB_AUTH_PASSWORD:?Set HIVE_DB_AUTH_PASSWORD}
      # Role hive_jobs và schema pgboss của hàng đợi; thiếu thì hub chạy không có hàng đợi (không tạo được dự án).
      HIVE_DB_JOBS_PASSWORD: ${HIVE_DB_JOBS_PASSWORD:?Set HIVE_DB_JOBS_PASSWORD}
      HIVE_DATABASE_OWNER_URL: postgres://hive_owner:${HIVE_DB_OWNER_PASSWORD}@postgres:5432/hive
      HIVE_DATABASE_URL: postgres://hive_app:${HIVE_DB_APP_PASSWORD}@postgres:5432/hive
      HIVE_DATABASE_AUTH_URL: postgres://hive_auth:${HIVE_DB_AUTH_PASSWORD}@postgres:5432/hive
      HIVE_DATABASE_JOBS_URL: postgres://hive_jobs:${HIVE_DB_JOBS_PASSWORD}@postgres:5432/hive
      HIVE_AUTH_SECRET: ${HIVE_AUTH_SECRET:?Set HIVE_AUTH_SECRET}
      # Khoá chủ mã hoá secret (token Git, cấu hình kênh thông báo). Mất khoá là mất mọi secret đã lưu: sao lưu riêng.
      HIVE_MASTER_KEY: ${HIVE_MASTER_KEY:?Set HIVE_MASTER_KEY}
      HIVE_PUBLIC_URL: ${HIVE_PUBLIC_URL:?Set HIVE_PUBLIC_URL}
      # 1: hub chạy http trong mạng tin cậy vẫn mở /mcp cho agent trong run (chỉ nhận run token, không có OAuth).
      HIVE_MCP_ALLOW_HTTP: ${HIVE_MCP_ALLOW_HTTP:-0}
      HIVE_DELIVERY_OUTBOUND: ${HIVE_DELIVERY_OUTBOUND:-0}
      HIVE_ALLOW_EMAIL_SIGNUP: ${HIVE_ALLOW_EMAIL_SIGNUP:-0}
      HIVE_ORG_CREATORS: ${HIVE_ORG_CREATORS:-}
      HIVE_ROLES: ${HIVE_ROLES:-api,jobs}
      # Giới hạn kho tài liệu theo byte; cùng mặc định với platform/config.ts.
      HIVE_DOC_ASSET_MAX_BYTES: ${HIVE_DOC_ASSET_MAX_BYTES:-52428800}
      HIVE_DOC_ORG_STORAGE_BYTES: ${HIVE_DOC_ORG_STORAGE_BYTES:-5368709120}
      HIVE_DOC_IMPORT_MAX_BYTES: ${HIVE_DOC_IMPORT_MAX_BYTES:-2147483648}
      HIVE_EMBEDDINGS_URL: ${HIVE_EMBEDDINGS_URL:-}
      HIVE_EMBEDDINGS_API_KEY: ${HIVE_EMBEDDINGS_API_KEY:-}
      HIVE_EMBEDDINGS_MODEL: ${HIVE_EMBEDDINGS_MODEL:-}
      HIVE_EMBEDDINGS_DIMENSIONS: ${HIVE_EMBEDDINGS_DIMENSIONS:-}
      HIVE_GITHUB_CLIENT_ID: ${HIVE_GITHUB_CLIENT_ID:-}
      HIVE_GITHUB_CLIENT_SECRET: ${HIVE_GITHUB_CLIENT_SECRET:-}
      HIVE_GITLAB_CLIENT_ID: ${HIVE_GITLAB_CLIENT_ID:-}
      HIVE_GITLAB_CLIENT_SECRET: ${HIVE_GITLAB_CLIENT_SECRET:-}
      HIVE_GITLAB_ISSUER: ${HIVE_GITLAB_ISSUER:-}
      # Trống: hỏi GitHub bản worker mới nhất để trang Máy báo máy chạy bản cũ. "off" khi hub không ra được Internet.
      HIVE_WORKER_RELEASES: ${HIVE_WORKER_RELEASES:-}
      # Trống: app desktop nhận bản mới từ latest.json của bản phát hành mới nhất trên GitHub. "off" để tắt.
      HIVE_DESKTOP_RELEASES: ${HIVE_DESKTOP_RELEASES:-}
      # Trần artifact và link công khai; trống thì hub dùng mặc định (xem docs/self-hosting.md).
      HIVE_ARTIFACT_MAX_VERSION_BYTES: ${HIVE_ARTIFACT_MAX_VERSION_BYTES:-}
      HIVE_ARTIFACT_MAX_BLOB_BYTES: ${HIVE_ARTIFACT_MAX_BLOB_BYTES:-}
      HIVE_ARTIFACT_ORG_QUOTA_BYTES: ${HIVE_ARTIFACT_ORG_QUOTA_BYTES:-}
      HIVE_ARTIFACT_LINK_MAX_DAYS: ${HIVE_ARTIFACT_LINK_MAX_DAYS:-}
      # Mạng của proxy đứng trước hub (vd. Caddy): chỉ từ đây hub mới tin X-Forwarded-For để giới hạn tốc độ theo IP.
      HIVE_TRUSTED_PROXIES: ${HIVE_TRUSTED_PROXIES:-}
    ports:
      # Mặc định chỉ máy chủ gọi được (đứng sau Caddy). Máy chủ LAN không dùng HTTPS: HIVE_BIND=0.0.0.0.
      - "${HIVE_BIND:-127.0.0.1}:${HIVE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
  caddy:
    # auto: image caddy gốc. dns-cloudflare: thêm module DNS để lấy chứng chỉ Let's Encrypt cho tên miền trỏ về IP nội bộ.
    build:
      context: ./caddy
      target: ${HIVE_TLS:-auto}
      args:
        CADDY_IMAGE: ${HIVE_CADDY_IMAGE:-caddy:2.11.7}
        CADDY_BUILDER_IMAGE: ${HIVE_CADDY_BUILDER_IMAGE:-caddy:2.11.7-builder}
    profiles: [https]
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      HIVE_PUBLIC_URL: ${HIVE_PUBLIC_URL:?Set HIVE_PUBLIC_URL}
      HIVE_DEFAULT_SNI: ${HIVE_DEFAULT_SNI:-localhost}
      HIVE_TLS: ${HIVE_TLS:-auto}
      # Chỉ chế độ dns-cloudflare đọc; token nằm trong .env của máy chủ, không có trong Caddyfile hay image.
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  hive-pgdata:
  caddy_data:
  caddy_config:
