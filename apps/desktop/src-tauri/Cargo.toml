[package]
name = "xdev-hive-desktop"
version = "0.0.0"
description = "xDev Hive desktop: cửa sổ web và worker chạy nền"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "xdev_hive_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
