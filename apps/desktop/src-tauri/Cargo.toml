[package]
name = "xdev-hive-desktop"
version = "0.0.0"
description = "xDev Hive desktop: cửa sổ web và worker chạy nền"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "xdev_hive_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.5"
tauri-plugin-notification = "2.6"
tauri-plugin-updater = "2.13"
# Bộ chọn thư mục làm việc. Giữ 2.7.x: 2.8 mới phát hành chưa đủ hai tuần.
tauri-plugin-dialog = "~2.7.3"
# Bản thứ hai của app thoát ngay và đưa cửa sổ bản đang chạy lên trước. Giữ 2.5.1: các bản sau chưa đủ hai tuần.
tauri-plugin-single-instance = "=2.5.1"
url = "2"
tokio = { version = "1", features = ["time"] }
# Gọi MCP của hub bằng token cá nhân. Cùng bản với tauri-plugin-updater nên không dựng thêm; TLS do updater bật.
reqwest = { version = "0.13", default-features = false }
# reqwest trong cây dùng rustls-no-provider: app tự cài provider ring (src/tls.rs). Cùng bản và tính năng updater dùng.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Token cá nhân lưu trong keychain của hệ điều hành (macOS Keychain, Windows Credential Manager, Secret Service).
keyring = "4.2"
# sha256 của SKILL.md đã cài để nhận ra file người dùng sửa tay. Cùng bản đã có trong cây phụ thuộc.
sha2 = "0.10"
# Verifier và state của PKCE khi đăng nhập bằng trình duyệt. Cùng bản đã có trong cây phụ thuộc.
getrandom = "0.3"
base64 = "0.22"
# Terminal nhúng của màn Tài liệu từ code: PTY chạy được trên macOS, Windows (ConPTY) và Linux. 0.9.0 phát hành 02/2025.
portable-pty = "0.9.0"

[target.'cfg(windows)'.dependencies]
# Dò, đóng và buộc tắt Claude Desktop bằng Win32 thay vì PowerShell/taskkill (có lúc treo). Cùng bản đã có trong cây
# phụ thuộc.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
# Huỷ agent CLI của màn Tài liệu: gửi tín hiệu cho cả nhóm tiến trình. Cùng bản đã có trong cây phụ thuộc.
libc = "0.2"
