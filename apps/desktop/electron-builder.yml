appId: asia.xdev.hive
productName: xDev Hive
# Plain file names for GitHub release assets (it turns spaces into dots): xdev-hive-0.2.0-mac-arm64.dmg
artifactName: xdev-hive-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
extraResources:
  - from: out/mcp
    to: mcp
  - from: resources
    to: icons
asar: true
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  # Ad-hoc signature until there is a Developer ID: Apple Silicon refuses an app whose bundle seal is broken.
  identity: "-"
  target:
    - dmg
    - zip
win:
  target: nsis
nsis:
  artifactName: xdev-hive-${version}-win-${arch}-setup.${ext}
linux:
  # The default comes from the package name (@xdev-hive/desktop), which is not a valid file name.
  executableName: xdev-hive
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Development
deb:
  packageName: xdev-hive
  artifactName: xdev-hive-${version}-linux-${arch}.deb
  maintainer: xDev
  description: xDev Hive desktop admin
  depends:
    - libnss3
    - libgtk-3-0 | libgtk-3-0t64
    - libxss1
    - libasound2 | libasound2t64
    - libgbm1
    - xdg-utils
