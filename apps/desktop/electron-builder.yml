appId: asia.xdev.hive
productName: xDev Hive
directories:
  output: release
  buildResources: build
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
extraResources:
  - from: out/mcp
    to: mcp
  - from: resources
    to: icons
asar: true
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  target: nsis
linux:
  target: AppImage
  category: Development
