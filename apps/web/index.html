<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/xdev-hive-icon.svg" />
    <script>
      // Đặt class .dark trước khi vẽ để không nháy nền sáng. hive.theme: light | dark | system (mặc định theo hệ điều hành).
      (() => {
        try {
          const theme = localStorage.getItem("hive.theme");
          const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {}
      })();
    </script>
    <title>xDev Hive</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
