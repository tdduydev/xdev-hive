<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/xdev-hive-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hive" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Đặt class .dark trước khi vẽ để không nháy nền sáng. hive.theme: light | dark | system (mặc định theo hệ điều hành).
      (() => {
        try {
          const theme = localStorage.getItem("hive.theme");
          const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          // Cùng màu với THEME_COLOR trong src/lib/theme.ts.
          if (dark) document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#0f172a");
        } catch {}
      })();
    </script>
    <title>xDev Hive</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
