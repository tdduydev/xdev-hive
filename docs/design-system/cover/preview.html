<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--canvas); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .band { position: absolute; top: 0; left: 0; width: 960px; height: 112px; }
  .band svg { display: block; width: 960px; height: 112px; }
  .deep { fill: var(--brand-deep); }
  .blue { fill: var(--brand-blue); }
  .sky { fill: var(--brand-sky); }
  .ink { fill: var(--ink); }
  .blk { rx: var(--radius-xl); }
  .plus { stroke: var(--brand-sky); stroke-width: 2; stroke-linecap: round; fill: none; }
  .words { position: absolute; left: var(--space-12); right: var(--space-12); top: 144px; }
  .name { margin: 0; font-family: var(--font-display); font-size: 60px; line-height: .95; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }
  .tag { margin: var(--space-3) 0 0 2px; max-width: 440px; font-size: 14px; line-height: 20px; color: var(--muted); }
</style>
