<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AppLeader · xDev Hive</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xdev-hive/tokens.css">
</head>
<body>
<x-dc>
<helmet><style>
body{margin:0}.ar-board{container-type:inline-size;background:var(--background);color:var(--foreground);font:14px/1.5 var(--font-sans);min-width:0;color-scheme:light}.ar-board[data-theme=dark]{color-scheme:dark}
.ar-board *{box-sizing:border-box}.ar-board :is(h1,h2,h3,p){margin:0}.ar-board :is(h1,h2,h3){font-family:var(--font-heading);text-wrap:balance}.ar-board h1{font-size:1.25rem}.ar-board h2{font-size:1rem}.ar-board h3{font-size:.875rem}
.ar-board :is(button,input,textarea,select,a):focus-visible{outline:2px solid var(--ring);outline-offset:2px}.ar-board :is(button,input,textarea,select){font:inherit}.ar-board :is(button,a){touch-action:manipulation}.ar-board a{color:var(--primary);text-underline-offset:3px}.ar-board a:hover{text-decoration-thickness:2px}
.ar-board button{cursor:pointer}.ar-board button:disabled{opacity:.5;cursor:not-allowed}.ar-board :is(input,textarea,select){width:100%;min-width:0;background:var(--background);color:var(--foreground);border:1px solid var(--input);border-radius:var(--radius);padding:.5rem .75rem}.ar-board textarea{resize:vertical}.ar-board input[type=checkbox],.ar-board input[type=radio]{width:auto;accent-color:var(--primary)}
.ar-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:36px;padding:.375rem .75rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--foreground);font-weight:500;text-decoration:none;white-space:normal}.ar-board a.ar-btn{color:var(--foreground)}.ar-btn:hover:not(:disabled){background:var(--muted)}.ar-btn.primary{background:var(--primary);color:var(--primary-foreground);border-color:transparent}.ar-btn.primary:hover:not(:disabled){opacity:.9}.ar-btn.danger{color:var(--destructive);border-color:var(--destructive)}
.ar-stack{display:flex;flex-direction:column;gap:1rem;min-width:0}.ar-row{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem .75rem;min-width:0}.ar-spread{justify-content:space-between}.ar-grow{flex:1;min-width:0}.ar-muted{color:var(--muted-foreground)}.ar-mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}.ar-card{border:1px solid var(--border);border-radius:calc(var(--radius)*1.5);padding:1rem;background:var(--card);min-width:0}.ar-card p,.ar-card h2,.ar-card h3{overflow-wrap:anywhere}.ar-badge{align-self:flex-start;display:inline-flex;align-items:center;gap:.375rem;background:var(--muted);color:var(--muted-foreground);padding:.125rem .5rem;border-radius:var(--radius);font-size:.75rem}.ar-badge.selected{background:var(--accent);color:var(--accent-foreground)}
.ar-alert{padding:.75rem 1rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--muted);overflow-wrap:anywhere}.ar-alert.warning{background:var(--warning-soft);color:var(--warning)}.ar-alert.error{background:var(--destructive-soft);color:var(--destructive)}.ar-alert.success{background:var(--success-soft);color:var(--success)}
.ar-main{padding:1.5rem;max-width:1200px;margin:auto;width:100%}.ar-toolbar{padding:.75rem 1rem;border-bottom:1px solid var(--border);background:var(--card)}.ar-design{padding:.5rem 1rem;border-bottom:1px dashed var(--border);font-size:.75rem}.ar-design select{width:auto;max-width:100%;padding:.25rem}.ar-design label{min-width:0;max-width:100%}.ar-tabs{display:flex;gap:.5rem;flex-wrap:wrap}.ar-tabs [aria-pressed=true]{background:var(--accent);color:var(--accent-foreground);border-color:var(--primary)}
.ar-shell{display:flex;min-height:800px}.ar-content{flex:1;min-width:0}.ar-chat-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}.ar-chat{min-width:0}.ar-panel{min-width:0;min-height:640px}.ar-preview{min-height:280px;display:flex;flex-direction:column;gap:1rem;justify-content:center;padding:1.5rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--background)}
.ar-code{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--muted);padding:1rem;border-radius:var(--radius);font: .8125rem/1.7 var(--font-mono)}.ar-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.ar-field{display:flex;flex-direction:column;gap:.375rem;font-weight:500;min-width:0}.ar-table{width:100%;border-collapse:collapse;text-align:left;font-variant-numeric:tabular-nums}.ar-table :is(th,td){padding:.75rem;border-bottom:1px solid var(--border);overflow-wrap:anywhere}.ar-table th{font-weight:500;background:var(--muted)}.ar-table td{vertical-align:top}.ar-cards{display:none}.ar-skeleton{height:1rem;background:var(--muted);border-radius:var(--radius);width:80%}.ar-empty{padding:3rem 1rem;text-align:center;align-items:center}.ar-overlay{padding:2rem 1rem;background:var(--backdrop);min-height:760px;display:flex;align-items:flex-start;justify-content:center}.ar-dialog{width:100%;max-width:640px;box-shadow:var(--shadow-lg);overscroll-behavior:contain}.ar-dialog:focus-visible{outline:2px solid var(--ring)}.ar-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.ar-skip{position:absolute;left:1rem;top:0;transform:translateY(-200%)}.ar-skip:focus{position:relative;transform:none}.ar-diff-add{color:var(--success);background:var(--success-soft)}.ar-diff-del{color:var(--destructive);background:var(--destructive-soft)}
@container (max-width:1023px){.ar-chat-layout{grid-template-columns:minmax(0,1fr)}.ar-chat-layout[data-panel-open=true]>.ar-chat{display:none}.ar-chat-layout[data-panel-open=false]>.ar-panel{display:none}.ar-mobile{display:inline-flex}.ar-nav{display:none}.ar-panel{min-height:760px}.ar-thread-list{display:none}}
@container (min-width:1024px){.ar-mobile{display:none}.ar-thread-list{width:220px;flex:none}}
@container (max-width:640px){.ar-main{padding:1rem;padding-bottom:max(1rem,env(safe-area-inset-bottom))}.ar-grid{grid-template-columns:minmax(0,1fr)}.ar-table{display:none}.ar-cards{display:flex;flex-direction:column;gap:.75rem}.ar-overlay{padding:1rem .5rem}.ar-preview{padding:1rem}.ar-btn{min-height:44px}.ar-toolbar{padding:.75rem}.ar-dialog{max-height:none}.ar-design{gap:.5rem}}
@container(max-width:1279px){.ar-host-nav{display:none}}
</style></helmet>
<div class="ar-board" data-theme="{{theme}}" lang="{{lang}}" style="{{boardStyle}}">
<a class="ar-skip" href="#artifact-panel-main">{{t.skip}}</a>
<sc-if value="{{showTools}}" hint-placeholder-val="{{true}}"><section class="ar-design ar-row" aria-label="{{t.states}}" data-design-tools>
<label class="ar-row">{{t.states}}<select name="design-state" value="{{view}}" onChange="{{setView}}"><sc-for list="{{modes}}" as="mode"><option value="{{mode.value}}">{{mode.label}}</option></sc-for></select></label>
<button type="button" class="ar-btn" onClick="{{toVi}}" aria-label="Tiếng Việt">VI</button><button type="button" class="ar-btn" onClick="{{toEn}}" aria-label="English">EN</button><button type="button" class="ar-btn" onClick="{{toggleTheme}}">{{t.theme}}</button><button type="button" class="ar-btn" onClick="{{toggleSize}}">{{t.size}}</button>
</section></sc-if>

<div class="ar-shell"><aside class="ar-nav ar-host-nav"><dc-import name="AppNav" active="leader" role="{{role}}" lang="{{lang}}" hint-size="220px,900px"></dc-import></aside><div class="ar-content">
<header class="ar-toolbar ar-row ar-spread"><h1>Leader</h1><div class="ar-row"><a class="ar-btn" href="AppArtifacts.dc.html">Artifact</a><button type="button" class="ar-btn" onClick="{{toggleThreads}}">{{t.threads}}</button><button type="button" class="ar-btn" disabled="{{blocked}}" onClick="{{newConversation}}">{{t.newThread}}</button></div></header>
<sc-if value="{{showThreads}}"><nav class="ar-toolbar ar-stack" aria-label="{{t.threads}}"><label class="ar-field">{{t.searchThreads}}<input name="thread-query" type="search" value="{{query}}" onInput="{{setQuery}}" autocomplete="off"></label><sc-for list="{{threads}}" as="thread"><button type="button" class="ar-btn" onClick="{{thread.pick}}" aria-pressed="{{thread.selected}}">{{thread.title}}</button></sc-for><sc-if value="{{noThreads}}"><p>{{t.noThreads}}</p></sc-if></nav></sc-if>
<sc-if value="{{hasMessage}}"><p role="status" class="ar-alert success">{{message}}</p></sc-if>
<dc-import name="ArtifactPanel" embedded="{{true}}" layout="chat" lang="{{lang}}" dark="{{dark}}" view="{{view}}" hint-size="100%,950px"></dc-import>
</div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["vi","en"],"default":"vi"},"dark":{"editor":"boolean","default":false},"narrow":{"editor":"boolean","default":false},"view":{"editor":"enum","options":["ready","loading","empty","error","offline","runtime","compile","newer","uncached"],"default":"ready"},"embedded":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1000},"role":{"editor":"enum","options":["dev","writer","lead"],"default":"dev"}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = {}; }
  renderVals() {

    const lang = this.state.lang ?? this.props.lang ?? 'vi';
    const dark = this.state.dark ?? !!this.props.dark;
    const narrow = this.state.narrow ?? !!this.props.narrow;
    const view = this.state.view ?? this.props.view ?? 'ready';
    const x = (p) => p[lang === 'en' ? 1 : 0];
    const T = {"states":["Trạng thái thiết kế","Design state"],"theme":["Đổi sáng/tối","Toggle theme"],"size":["Đổi cỡ 360 px","Toggle 360 px"],"versions":["Phiên bản","Versions"],"private":["Cá nhân","Private"],"project":["Dự án","Project"],"done":["Đã lưu thay đổi mẫu.","Sample changes saved."],"newThread":["Cuộc trò chuyện mới","New conversation"],"copied":["Đã sao chép.","Copied."],"flow":["Luồng hoàn tiền","Refund flow"],"checklist":["Checklist release 1.4","Release checklist 1.4"],"newConversation":["Đã mở cuộc trò chuyện mới mẫu.","Opened a new sample conversation."],"threads":["Cuộc trò chuyện","Conversations"],"searchThreads":["Tìm cuộc trò chuyện","Search conversations"],"noThreads":["Không có cuộc trò chuyện phù hợp.","No matching conversations."],"skip":["Đến nội dung chính","Skip to content"]};
    const t = Object.fromEntries(Object.entries(T).map(([k,v]) => [k,x(v)]));
    const normal = !['loading','empty','error'].includes(view);
    const blocked = view === 'offline' || view === 'loading';
    const selectView = (v) => this.setState({ view:v, message:'' });
    const modeLabels = {"ready":["Sẵn sàng","Ready"],"loading":["Đang tải…","Loading…"],"empty":["Rỗng","Empty"],"error":["Lỗi tải","Load error"],"offline":["Offline","Offline"],"runtime":["Trang báo lỗi","Page error"],"compile":["Lỗi biên dịch","Compile error"],"newer":["Bản mới hơn","Newer version"],"uncached":["Chưa tải","Not downloaded"]};
    const modes = ["ready", "loading", "empty", "error", "offline", "runtime", "compile", "newer", "uncached"].map(v => ({value:v,label:x(modeLabels[v])}));
    const base = {onlineActions:!blocked,lang,dark,narrow,view,t,modes,normal,blocked,isLoading:view==='loading',isEmpty:view==='empty',isError:view==='error',isOffline:view==='offline',showTools:!this.props.embedded,
      theme:dark?'dark':'light',boardStyle:'width: '+(this.props.embedded?'100%':narrow?'360px':'100%')+'; max-width:100%; min-height: '+(this.props.embedded?'0':'800px')+';',
      setView:e=>selectView(e.target.value),retry:()=>selectView('ready'),toVi:()=>this.setState({lang:'vi'}),toEn:()=>this.setState({lang:'en'}),toggleTheme:()=>this.setState({dark:!dark}),toggleSize:()=>this.setState({narrow:!narrow}),message:this.state.message || '',hasMessage:!!this.state.message,
      saved:()=>this.setState({message:t.done}),copy:()=>this.setState({message:t.copied}),
    };



    const query=this.state.query??'';const names=[t.flow,t.checklist];const threads=names.filter(n=>n.toLocaleLowerCase(lang).includes(query.toLocaleLowerCase(lang))).map(title=>({title,selected:title===(this.state.thread??names[0]),pick:()=>this.setState({thread:title,showThreads:false})}));
    return {...base,role:this.props.role??'dev',query,threads,noThreads:threads.length===0,showThreads:this.state.showThreads??false,toggleThreads:()=>this.setState({showThreads:!this.state.showThreads}),setQuery:e=>this.setState({query:e.target.value}),newConversation:()=>this.setState({message:t.newConversation})};

  }
}
</script>
</body>
</html>
