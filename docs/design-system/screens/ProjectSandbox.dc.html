<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sandbox dự án</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xdev-hive/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--primary)}a:hover{color:var(--accent-foreground)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.btn{height:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap;text-decoration:none}
.btn-default{background:var(--primary);color:var(--primary-foreground)}
.btn-outline{background:var(--background);color:var(--foreground);border-color:var(--border)}
.btn-ghost{background:transparent;color:var(--foreground)}
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:12px}
.card-h{padding:16px 20px 0;display:flex;flex-direction:column;gap:2px}
.card-t{margin:0;font-size:15px;font-weight:600}
.card-b{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted-foreground)}
.input{height:32px;box-sizing:border-box;padding:0 10px;border:1px solid var(--input);border-radius:8px;background:transparent;color:var(--foreground);font:inherit;font-size:14px;width:100%}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;min-width:0}
.hint{font-size:12px;font-weight:400;color:var(--muted-foreground)}
.code{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;background:var(--muted);font-family:var(--font-mono);font-size:12.5px}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 1000px; display: flex; flex-wrap: wrap; background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: 14px; line-height: 1.5;">
  <dc-import name="Sidebar" active="projects" lang="{{lang}}" hint-size="240px,1000px"></dc-import>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
    <dc-import name="Topbar" crumb="Sandbox · payment-api" lang="{{lang}}" dark="{{dark}}" on-lang="{{setLang}}" on-theme="{{setTheme}}" hint-size="100%,52px"></dc-import>
    <main style="box-sizing: border-box; width: 100%; max-width: 1180px; padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 20px;">
      <header style="display: flex; flex-direction: column; gap: 8px;">
        <div class="muted" style="font-size: 13px;"><a href="Projects.dc.html" style="text-decoration: none;">{{t.projects}}</a> / <span class="mono">payment-api</span> / Sandbox</div>
        <h1 style="margin: 0; font-family: var(--font-heading); font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.03em;">Sandbox</h1>
      </header>
      <div role="status" style="padding: 12px 14px; border-radius: 10px; background: var(--warning-soft); color: var(--warning); display: flex; gap: 10px; align-items: center;">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"></path><path d="M12 9v4M12 17h.01"></path></svg>
        <span style="flex: 1;">{{t.offNote}}</span><a href="ProjectSettings.dc.html" class="btn btn-outline" style="height: 28px; font-size: 13px;">{{t.openSettings}}</a>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start;">
        <section class="card">
          <div class="card-h"><h2 class="card-t">{{t.effective}}</h2><span class="hint" style="font-size: 13px;">{{t.effectiveHint}}</span></div>
          <div class="card-b">
            <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <span class="mono muted" style="font-size: 11px; text-transform: uppercase; letter-spacing: .05em;">{{g.label}}</span>
                <div style="display: flex; flex-wrap: wrap; gap: 6px;"><sc-for list="{{g.items}}" as="i" hint-placeholder-count="3"><span class="code">{{i}}</span></sc-for></div>
              </div>
            </sc-for>
          </div>
        </section>

        <section class="card" style="grid-column: 1 / -1;">
          <div class="card-h"><h2 class="card-t">{{t.projectRules}}</h2><span class="hint" style="font-size: 13px;">{{t.projectRulesHint}}</span></div>
          <div class="card-b">
            <dc-import name="DataTable" columns="{{ruleCols}}" rows="{{ruleRows}}" facets="{{ruleFacets}}" bulk="{{ruleBulk}}" lang="{{lang}}" page-size="{{rsize}}" min-width="{{rminW}}" hint-size="100%,520px"></dc-import>
            <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end;">
              <label class="field">{{t.rule}}<input class="input mono" placeholder="api.stripe.com:443"></label>
              <label class="field">{{t.note}}<input class="input" placeholder="{{t.notePh}}"></label>
              <button type="button" class="btn btn-default">{{t.add}}</button>
            </div>
            <span class="hint">{{t.ruleHint}}</span>
          </div>
        </section>

        <section class="card" style="grid-column: 1 / -1;">
          <div class="card-h"><h2 class="card-t">{{t.image}}</h2><span class="hint" style="font-size: 13px;">{{t.imageHint}}</span></div>
          <div class="card-b" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) auto; gap: 14px; align-items: start;">
            <label class="field">{{t.base}}<input class="input mono" value="node:24-bookworm-slim"><span class="hint">{{t.baseHint}}</span></label>
            <label class="field">SHA-256 {{t.of}} .hive/setup.sh<input class="input mono" value="9f2c…a41e" style="font-size: 12.5px;"><span class="hint">{{t.shaHint}} <span class="mono">sha256sum .hive/setup.sh</span></span></label>
            <button type="button" class="btn btn-default" style="margin-top: 25px;">{{t.saveImage}}</button>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["vi","en"],"default":"vi"},"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lang: null, dark: null }; }
  renderVals() {
    const lang = this.state.lang ?? this.props.lang ?? 'vi';
    const dark = this.state.dark ?? !!this.props.dark;
    const en = lang === 'en';
    const x = (p) => (en ? p[1] : p[0]);
    const T = {
      projects: ['Dự án', 'Projects'], offNote: ['Dự án chưa bật sandbox nên run vẫn chạy trên máy dev. Bật ở cấu hình dự án.', 'Sandbox is off for this project, so runs still execute on dev machines. Turn it on in project settings.'],
      openSettings: ['Mở cấu hình', 'Open settings'], effective: ['Allowlist hiệu lực', 'Effective allowlist'],
      effectiveHint: ['Gộp từ danh sách đề xuất (nếu tổ chức bật), mục của tổ chức và mục của dự án.', 'Merged from the suggested list (if enabled), organization rules and project rules.'],
      projectRules: ['Mục mạng của dự án', 'Project network rules'], projectRulesHint: ['Chỉ áp dụng cho run sandbox của payment-api.', 'Applies only to payment-api sandbox runs.'],
      remove: ['Gỡ mục', 'Remove rule'], rule: ['Mục mạng', 'Network rule'], note: ['Ghi chú', 'Note'], notePh: ['Vì sao cần mở', 'Why it needs to be open'], add: ['Thêm', 'Add'],
      ruleHint: ['Tên miền, *.tên-miền, IP hoặc CIDR; thêm :cổng nếu cần.', 'Domain, *.domain, IP or CIDR; add :port if needed.'],
      image: ['Image môi trường', 'Environment image'], imageHint: ['Runner host dựng image một lần và cache theo hash của script setup.', 'The runner host builds the image once and caches it by the setup script hash.'],
      base: ['Image gốc', 'Base image'], baseHint: ['Image có sẵn CLI agent cần dùng.', 'An image that already has the agent CLIs it needs.'], of: ['của', 'of'],
      shaHint: ['Lấy bằng', 'Get it with'], saveImage: ['Lưu image', 'Save image'],
    };
    const t = {}; Object.keys(T).forEach((k) => { t[k] = x(T[k]); });
    const groups = [
      { label: x(['Đề xuất', 'Suggested']), items: ['registry.npmjs.org', 'proxy.golang.org', 'pypi.org', 'github.com:443'] },
      { label: x(['Tổ chức', 'Organization']), items: ['*.acme.vn', '10.86.0.0/16'] },
      { label: x(['Dự án', 'Project']), items: ['api.stripe.com:443', 'sandbox.vnpay.vn'] },
    ];
    const rules = [
      { rule: 'api.stripe.com:443', note: x(['Gọi API thanh toán khi chạy test tích hợp', 'Payment API for integration tests']) },
      { rule: 'sandbox.vnpay.vn', note: x(['Môi trường thử của VNPAY', 'VNPAY test environment']) },
    ];
    const hosts = ['*.acme.vn', '10.86.0.0/16', 'artifactory.acme.vn:443', 'api.stripe.com:443', 'sandbox.vnpay.vn', 'registry.npmjs.org', 'proxy.golang.org', 'pypi.org', 'crates.io', 'github.com:443', 'objects.githubusercontent.com', 'dl.google.com', 'repo.maven.apache.org', 'api.openai.com', 'api.anthropic.com', 'sentry.io', 'hooks.slack.com', '172.16.10.0/24', 'nexus.acme.vn', 'docker.io', 'ghcr.io', 'quay.io', 'cdn.jsdelivr.net', 'fonts.googleapis.com'];
    const who = ['Trần Lan', 'Nguyễn Minh', 'Phạm Hà', 'Lê Quang'];
    const kindOf = (h) => (/\/\d+$/.test(h) ? 'CIDR' : /^\d/.test(h) ? 'IP' : h.startsWith('*.') ? x(['Tên miền con', 'Wildcard']) : x(['Tên miền', 'Domain']));
    const ruleRows = hosts.map((h, i) => ({ id: 'n' + i, rule: h, kind: kindOf(h), port: h.includes(':') ? h.split(':').pop() : x(['mọi cổng', 'any']), note: x(['Mở cho run cần gọi ra ngoài', 'Needed by runs that call out']), by: who[i % 4], hits: (i * 37 % 400), _sort_hits: i * 37 % 400, src: i < 5 ? x(['Đề xuất', 'Suggested']) : i % 3 ? x(['Tổ chức', 'Organization']) : x(['Dự án', 'Project']) }));
    const ruleCols = [{ key: 'rule', label: x(['Mục mạng', 'Rule']), type: 'mono', sortable: true }, { key: 'kind', label: x(['Loại', 'Type']) }, { key: 'port', label: x(['Cổng', 'Port']), type: 'mono' }, { key: 'src', label: x(['Nguồn', 'Source']) }, { key: 'hits', label: x(['Lượt dùng 7 ngày', 'Hits, 7d']), type: 'num', sortable: true }, { key: 'by', label: x(['Người thêm', 'Added by']), type: 'muted' }];
    const ruleFacets = [{ key: 'kind', label: x(['Loại', 'Type']) }, { key: 'src', label: x(['Nguồn', 'Source']) }, { key: 'by', label: x(['Người thêm', 'Added by']) }];
    return { theme: dark ? 'dark' : 'light', lang, dark, t, groups, rules, ruleCols, ruleRows, ruleFacets, rsize: 10, rminW: 760, ruleBulk: [x(['Gỡ', 'Remove'])], setLang: (v) => this.setState({ lang: v }), setTheme: (v) => this.setState({ dark: v }) };
  }
}
</script>
</body>
</html>
