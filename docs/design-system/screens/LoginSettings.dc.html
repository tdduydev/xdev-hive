<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cài đặt đăng nhập</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xdev-hive/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--primary)}a:hover{color:var(--accent-foreground)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.btn{height:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap;text-decoration:none}
.btn-default{background:var(--primary);color:var(--primary-foreground)}
.btn-outline{background:var(--background);color:var(--foreground);border-color:var(--border)}
.btn-ghost{background:transparent;color:var(--foreground)}
.btn-sm{height:28px;font-size:13px}
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:12px}
.card-h{padding:16px 20px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-t{margin:0;font-size:15px;font-weight:600}
.card-b{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:9999px;font-size:12px;font-weight:500;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:9999px;background:currentColor}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted-foreground)}
.input{height:32px;box-sizing:border-box;padding:0 10px;border:1px solid var(--input);border-radius:8px;background:transparent;color:var(--foreground);font:inherit;font-size:14px;width:100%}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;min-width:0}
.hint{font-size:12px;font-weight:400;color:var(--muted-foreground)}
.copy{display:flex;gap:6px}.copy .input{background:var(--muted);font-family:var(--font-mono);font-size:12.5px}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 1400px; display: flex; flex-wrap: wrap; background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: 14px; line-height: 1.5;">
  <dc-import name="Sidebar" active="signin" lang="{{lang}}" hint-size="240px,1400px"></dc-import>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
    <dc-import name="Topbar" crumb="{{t.title}}" lang="{{lang}}" dark="{{dark}}" on-lang="{{setLang}}" on-theme="{{setTheme}}" hint-size="100%,52px"></dc-import>
    <main style="box-sizing: border-box; width: 100%; max-width: 1040px; padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 20px;">
      <header style="display: flex; flex-direction: column; gap: 6px;">
        <div class="muted" style="font-size: 13px;">{{t.admin}}</div>
        <h1 style="margin: 0; font-family: var(--font-heading); font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.03em;">{{t.title}}</h1>
        <p class="muted" style="margin: 0;">{{t.lead}}</p>
      </header>

      <section class="card" aria-label="{{t.methods}}">
        <ul style="margin: 0; padding: 0; list-style: none;">
          <sc-for list="{{methods}}" as="m" hint-placeholder-count="4">
            <li style="display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--border);">
              <span style="width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid var(--border);"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.icon}}"></path></svg></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35;"><strong style="font-weight: 600;">{{m.name}}</strong><span class="muted" style="font-size: 13px;">{{m.detail}}</span></span>
              <span class="badge" style="{{m.chip}}"><span class="dot"></span>{{m.status}}</span>
            </li>
          </sc-for>
        </ul>
      </section>

      <section class="card">
        <div class="card-h"><div style="display: flex; flex-direction: column; gap: 2px;"><h2 class="card-t">SSO (OIDC)</h2><span class="hint" style="font-size: 13px;">{{t.ssoHint}}</span></div><button type="button" class="btn btn-ghost btn-sm" style="color: var(--destructive);">{{t.removeSso}}</button></div>
        <div class="card-b">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
            <label class="field">Issuer URL<input class="input mono" style="font-size: 13px;" value="https://login.microsoftonline.com/3f1c…/v2.0"></label>
            <label class="field">{{t.domain}}<input class="input mono" value="acme.vn"><span class="hint">{{t.domainHint}}</span></label>
            <label class="field">Client ID<input class="input mono" placeholder="…"><span class="hint">{{t.clientHint}}</span></label>
            <label class="field">Client secret<input class="input" type="password" placeholder="{{t.secretPh}}"><span class="hint">{{t.secretHint}}</span></label>
          </div>
          <label class="field">{{t.callback}}<span class="copy"><input class="input" readonly value="https://hive.acme.vn/api/v1/auth/oidc/acme/callback"><button type="button" class="btn btn-outline" style="flex: none;">{{t.copy}}</button></span></label>
          <label class="field">{{t.firstLogin}}<select class="input"><option>{{t.queue}}</option><option>{{t.autoAdd}}</option></select></label>
          <div style="display: flex; justify-content: flex-end;"><button type="button" class="btn btn-default">{{t.save}}</button></div>
        </div>
      </section>

      <section class="card">
        <div class="card-h"><div style="display: flex; flex-direction: column; gap: 2px;"><h2 class="card-t">{{t.verify}}</h2><span class="hint" style="font-size: 13px;">{{t.verifyHint}}</span></div><span class="badge" style="{{vChip}}"><span class="dot"></span>{{vLabel}}</span></div>
        <div class="card-b">
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 14px;">
            <label class="field">{{t.txtName}}<span class="copy"><input class="input" readonly value="_hive-verify.acme.vn"><button type="button" class="btn btn-outline" style="flex: none;">{{t.copy}}</button></span></label>
            <label class="field">{{t.txtValue}}<span class="copy"><input class="input" readonly value="hive-domain=9b3e7c1d2a…"><button type="button" class="btn btn-outline" style="flex: none;">{{t.copy}}</button></span></label>
          </div>
          <sc-if value="{{verified}}" hint-placeholder-val="{{false}}"><div role="status" style="padding: 10px 12px; border-radius: 8px; background: var(--success-soft); color: var(--success); font-size: 13px;">{{t.verifiedMsg}}</div></sc-if>
          <div style="display: flex; justify-content: flex-end; gap: 8px;"><button type="button" class="btn btn-outline" onClick="{{check}}">{{t.check}}</button></div>
        </div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["vi","en"],"default":"vi"},"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { verified: false, lang: null, dark: null }; }
  renderVals() {
    const lang = this.state.lang ?? this.props.lang ?? 'vi';
    const dark = this.state.dark ?? !!this.props.dark;
    const en = lang === 'en';
    const x = (p) => (en ? p[1] : p[0]);
    const T = {
      title: ['Cài đặt đăng nhập', 'Sign-in settings'], admin: ['Quản trị', 'Admin'], lead: ['Cách người trong tổ chức đăng nhập vào hub.', 'How people in the organization sign in to the hub.'], methods: ['Cách đăng nhập', 'Sign-in methods'],
      ssoHint: ['Dùng nhà cung cấp danh tính của công ty, ví dụ Microsoft Entra, Google Workspace, Keycloak.', 'Use your company identity provider, e.g. Microsoft Entra, Google Workspace, Keycloak.'],
      removeSso: ['Gỡ SSO', 'Remove SSO'], domain: ['Tên miền email', 'Email domain'], domainHint: ['Người có email tên miền này đăng nhập bằng SSO của tổ chức.', 'People with this email domain sign in through the organization SSO.'],
      clientHint: ['Đang dùng Client ID kết thúc bằng 8f2a. Nhập lại khi lưu.', 'Current Client ID ends in 8f2a. Re-enter it to save.'], secretPh: ['Đã lưu, không hiện lại', 'Saved, never shown again'],
      secretHint: ['Để trống nếu không đổi.', 'Leave empty to keep it.'], callback: ['Callback URL (dán vào cấu hình app bên nhà cung cấp)', 'Callback URL (paste into the provider app settings)'], copy: ['Chép', 'Copy'],
      firstLogin: ['Khi người mới đăng nhập SSO lần đầu', 'When someone signs in with SSO for the first time'], queue: ['Vào hàng chờ duyệt (khuyên dùng)', 'Queue for approval (recommended)'],
      autoAdd: ['Tự thêm vào tổ chức với vai trò Thành viên, chưa thuộc đội nào', 'Add them as a Member with no team'], save: ['Lưu', 'Save'],
      verify: ['Xác minh tên miền', 'Domain verification'], verifyHint: ['Thêm bản ghi TXT vào DNS của acme.vn rồi bấm Kiểm tra.', 'Add a TXT record to the acme.vn DNS, then check.'],
      txtName: ['Tên bản ghi (TXT)', 'Record name (TXT)'], txtValue: ['Giá trị', 'Value'], check: ['Kiểm tra', 'Check'], verifiedMsg: ['Đã xác minh tên miền acme.vn.', 'acme.vn is verified.'],
    };
    const t = {}; Object.keys(T).forEach((k) => { t[k] = x(T[k]); });
    const on = 'background: var(--success-soft); color: var(--success);';
    const hub = 'background: var(--muted); color: var(--muted-foreground);';
    const key = 'M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z';
    const git = 'M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4M9 18c-4.51 2-5-2-7-2';
    const lab = 'm22 13.29-3.33-10a.42.42 0 0 0-.14-.18.38.38 0 0 0-.22-.11.39.39 0 0 0-.23.07.42.42 0 0 0-.14.18l-2.26 6.67H8.32L6.1 3.26a.42.42 0 0 0-.1-.18.38.38 0 0 0-.26-.08.39.39 0 0 0-.23.07.42.42 0 0 0-.14.18L2 13.29a.74.74 0 0 0 .27.83L12 21l9.69-6.88a.71.71 0 0 0 .31-.83Z';
    const mail = 'M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm18 2-10 7L2 6';
    const methods = [
      { icon: key, name: 'SSO (OIDC)', detail: x(['login.microsoftonline.com · acme.vn · người mới: chờ duyệt', 'login.microsoftonline.com · acme.vn · new people: queued']), chip: on, status: x(['Đang bật', 'On']) },
      { icon: git, name: 'GitHub', detail: x(['OAuth app chung của hub, quản trị hub cấu hình.', 'Shared hub OAuth app, set up by the hub admin.']), chip: hub, status: x(['Cấu hình ở hub', 'Set at hub level']) },
      { icon: lab, name: 'GitLab', detail: x(['OAuth app chung của hub, quản trị hub cấu hình.', 'Shared hub OAuth app, set up by the hub admin.']), chip: hub, status: x(['Cấu hình ở hub', 'Set at hub level']) },
      { icon: mail, name: x(['Email và mật khẩu', 'Email and password']), detail: x(['Người mới đăng ký bằng link mời, trừ khi quản trị hub mở đăng ký tự do.', 'New people sign up through an invite link unless the hub admin opens sign-up.']), chip: on, status: x(['Đang bật', 'On']) },
    ];
    const v = this.state.verified;
    return {
      theme: dark ? 'dark' : 'light', lang, dark, t, methods, verified: v,
      vChip: v ? on : 'background: var(--warning-soft); color: var(--warning);', vLabel: v ? x(['Đã xác minh', 'Verified']) : x(['Chưa xác minh', 'Not verified']),
      check: () => this.setState({ verified: true }),
      setLang: (val) => this.setState({ lang: val }), setTheme: (val) => this.setState({ dark: val }),
    };
  }
}
</script>
</body>
</html>
