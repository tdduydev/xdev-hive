<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lượt chạy</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xdev-hive/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted-foreground)}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 1000px; display: flex; flex-wrap: wrap; background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: 14px; line-height: 1.5;">
  <dc-import name="Sidebar" active="runs" lang="{{lang}}" hint-size="240px,1000px"></dc-import>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
    <dc-import name="Topbar" crumb="{{t.title}}" lang="{{lang}}" dark="{{dark}}" on-lang="{{setLang}}" on-theme="{{setTheme}}" hint-size="100%,52px"></dc-import>
    <main style="box-sizing: border-box; width: 100%; max-width: 1360px; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 18px;">
      <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <h1 style="margin: 0; font-family: var(--font-heading); font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.03em;">{{t.title}}</h1>
          <p class="muted" style="margin: 0;">{{t.lead}}</p>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 18px; font-size: 13px;" class="muted">
          <sc-for list="{{stats}}" as="s" hint-placeholder-count="4"><span><strong class="mono" style="color: var(--foreground); font-size: 15px;">{{s.v}}</strong> {{s.l}}</span></sc-for>
        </div>
      </header>
      <dc-import name="DataTable" columns="{{columns}}" rows="{{rows}}" facets="{{facets}}" bulk="{{bulk}}" lang="{{lang}}" placeholder="{{t.search}}" page-size="{{size}}" min-width="{{minW}}" hint-size="100%,700px"></dc-import>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["vi","en"],"default":"vi"},"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: null, dark: null };
    const titles = [
      ['Sửa làm tròn tiền trong hoá đơn VAT', 'Fix VAT invoice rounding'], ['Thêm phân trang cho API giao dịch', 'Paginate the transactions API'],
      ['Hỗ trợ proxy công ty khi tải CLI', 'Support corporate proxy for CLI downloads'], ['Nâng Go lên 1.27 trong worker', 'Upgrade worker to Go 1.27'],
      ['Đổi route web sang tiếng Anh', 'Rename web routes to English'], ['Ghi log khi runner mất kết nối', 'Log runner disconnects'],
      ['Viết test cho webhook GitLab', 'Test the GitLab webhook'], ['Dọn worktree cũ sau 7 ngày', 'Clean worktrees older than 7 days'],
      ['Hoàn tiền một phần', 'Partial refunds'], ['Đối soát cuối ngày với ngân hàng', 'End-of-day bank reconciliation'],
      ['Màn chi tiết giao dịch trên di động', 'Transaction detail on mobile'], ['Giới hạn tốc độ API công khai', 'Rate-limit the public API'],
    ];
    const st = ['running', 'running', 'waiting', 'plan', 'ok', 'ok', 'ok', 'ok', 'failed', 'cancelled', 'nochange', 'ok', 'lost'];
    let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    this.data = Array.from({ length: 1286 }, (_, i) => {
      const s = st[Math.floor(rnd() * st.length)]; const ti = Math.floor(rnd() * titles.length);
      return {
        id: (0x7f3a91c2 - i * 104729 >>> 0).toString(16).slice(-8), key: 'TASK-' + (900 - Math.floor(i / 2)), project: ['payment-api', 'hive-worker', 'mobile-app', 'partner-portal'][ti % 4],
        title: titles[ti], status: s, cli: ['Claude', 'Claude', 'Codex', 'Gemini'][Math.floor(rnd() * 4)], machine: ['mac-mini-lan', 'linux-build-01', 'win-dev-03', 'hc-linux-52'][Math.floor(rnd() * 4)],
        mins: i * 11 + Math.floor(rnd() * 10), dur: s === 'running' ? null : 2 + Math.floor(rnd() * 40), cost: s === 'cancelled' ? 0.04 : Math.round(rnd() * 300) / 100,
        pr: s === 'ok' && rnd() > 0.3 ? '#' + (500 - Math.floor(i / 3)) : '—', review: rnd() > 0.85,
      };
    });
  }
  renderVals() {
    const lang = this.state.lang ?? this.props.lang ?? 'vi';
    const dark = this.state.dark ?? !!this.props.dark;
    const en = lang === 'en';
    const x = (p) => (en ? p[1] : p[0]);
    const t = {
      title: x(['Lượt chạy', 'Runs']), lead: x(['Mọi lần agent nhận việc, trên mọi máy của tổ chức.', 'Every time an agent picks up a task, on every machine in the organization.']),
      search: x(['Tìm theo mã run, việc, tiêu đề…', 'Search run, task or title…']),
    };
    const SL = {
      running: [['Đang chạy', 'Running'], 'accent'], waiting: [['Cần người xem', 'Needs review'], 'warn'], plan: [['Chờ duyệt kế hoạch', 'Plan awaiting review'], 'warn'],
      ok: [['Thành công', 'Succeeded'], 'ok'], failed: [['Lỗi', 'Failed'], 'bad'], lost: [['Mất máy', 'Machine lost'], 'bad'], cancelled: [['Đã huỷ', 'Cancelled'], 'off'], nochange: [['Không có thay đổi', 'No changes'], 'off'],
    };
    const ago = (m) => (m < 60 ? x([m + ' phút trước', m + ' min ago']) : m < 1440 ? x([Math.floor(m / 60) + ' giờ trước', Math.floor(m / 60) + ' h ago']) : x([Math.floor(m / 1440) + ' ngày trước', Math.floor(m / 1440) + ' d ago']));
    const money = (v) => (en ? '$' + v.toFixed(2) : v.toFixed(2).replace('.', ',') + ' USD');
    if (!this.cache || this.cache.lang !== lang) {
      this.cache = { lang, rows: this.data.map((r) => ({
        id: r.id, run: r.id, title: x(r.title), taskSub: r.key + ' · ' + r.project + (r.review ? x([' · review chéo', ' · cross-review']) : ''),
        status: { text: x(SL[r.status][0]), tone: SL[r.status][1] }, cli: r.cli, machine: r.machine, project: r.project,
        started: ago(r.mins), _sort_started: -r.mins, dur: r.dur == null ? '—' : r.dur + 'm', _sort_dur: r.dur ?? 1e9, cost: money(r.cost), _sort_cost: r.cost, pr: r.pr,
        _f_type: r.review ? x(['Review chéo', 'Cross-review']) : x(['Viết code', 'Coding']),
      })) };
    }
    const columns = [
      { key: 'run', label: 'Run', type: 'mono', sortable: true, link: true },
      { key: 'title', label: x(['Việc', 'Task']), type: 'title', sub: 'taskSub', subMono: true, sortable: true },
      { key: 'status', label: x(['Trạng thái', 'Status']), type: 'badge' },
      { key: 'cli', label: 'Agent', sortable: true },
      { key: 'machine', label: x(['Máy', 'Machine']), type: 'mono' },
      { key: 'started', label: x(['Bắt đầu', 'Started']), type: 'muted', sortable: true },
      { key: 'dur', label: x(['Thời lượng', 'Duration']), type: 'num', sortable: true },
      { key: 'cost', label: x(['Chi phí', 'Cost']), type: 'num', sortable: true },
      { key: 'pr', label: 'PR', type: 'mono', hidden: false },
    ];
    const facets = [
      { key: 'status', label: x(['Trạng thái', 'Status']) }, { key: 'project', label: x(['Dự án', 'Project']) }, { key: 'cli', label: 'Agent' },
      { key: 'machine', label: x(['Máy', 'Machine']) }, { key: 'type', label: x(['Loại run', 'Run type']) },
    ];
    const n = (v) => v.toLocaleString(en ? 'en' : 'vi');
    const stats = [
      { v: n(this.data.filter((r) => r.status === 'running').length), l: x(['đang chạy', 'running']) },
      { v: n(this.data.filter((r) => r.status === 'waiting' || r.status === 'plan').length), l: x(['chờ người', 'need you']) },
      { v: '86%', l: x(['thành công 7 ngày', 'success, 7d']) },
      { v: n(this.data.length), l: x(['run tất cả', 'runs total']) },
    ];
    return {
      theme: dark ? 'dark' : 'light', lang, dark, t, stats, columns, facets, rows: this.cache.rows, size: 10, minW: 1060,
      bulk: [x(['Chạy lại', 'Retry']), x(['Huỷ run', 'Cancel runs']), x(['Xuất log', 'Export logs'])],
      setLang: (v) => this.setState({ lang: v }), setTheme: (v) => this.setState({ dark: v }),
    };
  }
}
</script>
</body>
</html>
