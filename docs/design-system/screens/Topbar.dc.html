<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thanh trên</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xdev-hive/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
</style>
</helmet>
<header style="height: 52px; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; gap: 12px; background: var(--background); border-bottom: 1px solid var(--border); font-family: var(--font-sans); font-size: 14px; color: var(--foreground);">
  <nav aria-label="{{t.crumbAria}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden;">
    <span>Acme Software</span>
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
    <span style="color: var(--foreground); font-weight: 500;">{{crumb}}</span>
  </nav>
  <button type="button" style="width: 280px; max-width: 40%; height: 32px; padding: 0 8px 0 10px; display: flex; align-items: center; gap: 8px; background: var(--muted); border: 1px solid transparent; border-radius: 8px; color: var(--muted-foreground); font: inherit; font-size: 13px; cursor: pointer;">
    <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
    <span style="flex: 1; text-align: left;">{{t.search}}</span>
    <kbd style="font-family: var(--font-mono); font-size: 11px; padding: 1px 5px; background: var(--card); border: 1px solid var(--border); border-radius: 4px;">⌘K</kbd>
  </button>
  <div role="group" aria-label="{{t.langAria}}" style="display: inline-flex; padding: 2px; background: var(--muted); border-radius: 8px;">
    <button type="button" onClick="{{toVi}}" aria-pressed="{{viPressed}}" style="{{viStyle}}">VI</button>
    <button type="button" onClick="{{toEn}}" aria-pressed="{{enPressed}}" style="{{enStyle}}">EN</button>
  </div>
  <button type="button" onClick="{{flipTheme}}" aria-label="{{t.theme}}" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--foreground); cursor: pointer;">
    <sc-if value="{{dark}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2m-7.07-14.93 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"></path></svg></sc-if>
    <sc-if value="{{light}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></sc-if>
  </button>
  <button type="button" aria-label="{{t.inbox}}" style="position: relative; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--foreground); cursor: pointer;">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
    <span style="position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 9999px; background: var(--destructive); border: 2px solid var(--background);"></span>
  </button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"crumb":{"editor":"text","default":"Lượt chạy"},"lang":{"editor":"enum","options":["vi","en"],"default":"vi"},"dark":{"editor":"boolean","default":false},"onLang":{"editor":null},"onTheme":{"editor":null},"$preview":{"width":1200,"height":52}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang ?? 'vi';
    const en = lang === 'en';
    const dark = !!this.props.dark;
    const seg = (on) => 'height: 26px; min-width: 34px; padding: 0 8px; border: 0; border-radius: 6px; font-family: var(--font-mono); font-size: 12px; cursor: pointer; ' + (on ? 'background: var(--card); color: var(--foreground); font-weight: 600; box-shadow: var(--shadow-sm);' : 'background: transparent; color: var(--muted-foreground); font-weight: 500;');
    const t = en
      ? { crumbAria: 'Breadcrumb', search: 'Search tasks, runs, projects…', langAria: 'Language', theme: 'Toggle light or dark', inbox: 'Notifications' }
      : { crumbAria: 'Đường dẫn', search: 'Tìm việc, run, dự án…', langAria: 'Ngôn ngữ', theme: 'Đổi sáng hoặc tối', inbox: 'Thông báo' };
    const call = (f, v) => () => { if (typeof f === 'function') f(v); };
    return {
      t, crumb: this.props.crumb ?? 'Lượt chạy', dark, light: !dark,
      viPressed: en ? 'false' : 'true', enPressed: en ? 'true' : 'false', viStyle: seg(!en), enStyle: seg(en),
      toVi: call(this.props.onLang, 'vi'), toEn: call(this.props.onLang, 'en'), flipTheme: call(this.props.onTheme, !dark),
    };
  }
}
</script>
</body>
</html>
