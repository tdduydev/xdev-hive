<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Vai trò và quyền</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xdev-hive/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.btn{height:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-default{background:var(--primary);color:var(--primary-foreground)}
.btn-outline{background:var(--background);color:var(--foreground);border-color:var(--border)}
.btn-ghost{background:transparent;color:var(--foreground)}
.btn-sm{height:30px;font-size:13px}
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:12px}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:9999px;font-size:12px;font-weight:500;white-space:nowrap}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted-foreground)}
.input{height:30px;box-sizing:border-box;padding:0 10px;border:1px solid var(--input);border-radius:8px;background:transparent;color:var(--foreground);font:inherit;font-size:13.5px}
.node{display:flex;align-items:center;gap:8px;min-height:34px;padding:0 10px;border-radius:6px}
.node:hover{background:var(--muted)}
.chk{flex:none;width:16px;height:16px;padding:0;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.tw{flex:none;width:20px;height:20px;padding:0;border:0;border-radius:4px;background:transparent;color:var(--muted-foreground);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 1100px; display: flex; flex-wrap: wrap; background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: 14px; line-height: 1.5;">
  <dc-import name="Sidebar" active="roles" lang="{{lang}}" hint-size="240px,1100px"></dc-import>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
    <dc-import name="Topbar" crumb="{{t.title}}" lang="{{lang}}" dark="{{dark}}" on-lang="{{setLang}}" on-theme="{{setTheme}}" hint-size="100%,52px"></dc-import>
    <main style="box-sizing: border-box; width: 100%; max-width: 1320px; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 16px;">
      <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div class="muted" style="font-size: 13px;">{{t.crumb}}</div>
          <h1 style="margin: 0; font-family: var(--font-heading); font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.03em;">{{t.title}}</h1>
          <p class="muted" style="margin: 0;">{{t.lead}}</p>
        </div>
        <button type="button" class="btn btn-default"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"></path></svg>{{t.newRole}}</button>
      </header>

      <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start;">
        <nav aria-label="{{t.roles}}" class="card" style="flex: 1 1 260px; max-width: 290px; padding: 8px; display: flex; flex-direction: column; gap: 2px;">
          <sc-for list="{{roleGroups}}" as="rg" hint-placeholder-count="2">
            <div class="mono muted" style="padding: 8px 8px 4px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;">{{rg.label}}</div>
            <sc-for list="{{rg.roles}}" as="r" hint-placeholder-count="3">
              <button type="button" onClick="{{r.pick}}" style="{{r.style}}">
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; text-align: left;"><span style="display: flex; align-items: center; gap: 6px; font-weight: 500;">{{r.name}}<sc-if value="{{r.system}}" hint-placeholder-val="{{true}}"><svg aria-label="{{t.systemRole}}" role="img" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: .6;"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></sc-if></span><span class="muted" style="font-size: 12px;">{{r.meta}}</span></span>
              </button>
            </sc-for>
          </sc-for>
        </nav>

        <section class="card" style="flex: 999 1 600px; min-width: 0; overflow: hidden;">
          <div style="padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
            <div style="flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 2px;">
              <div style="display: flex; align-items: center; gap: 8px;"><h2 style="margin: 0; font-size: 17px; font-weight: 600;">{{cur.name}}</h2><span class="badge" style="background: var(--secondary); color: var(--secondary-foreground);">{{cur.scope}}</span><sc-if value="{{cur.system}}" hint-placeholder-val="{{true}}"><span class="badge" style="background: var(--muted); color: var(--muted-foreground);">{{t.systemRole}}</span></sc-if></div>
              <span class="muted" style="font-size: 13px;">{{cur.desc}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 12px;" class="muted"><span><strong class="mono" style="color: var(--foreground); font-size: 14px;">{{granted}}</strong> / {{totalLeaves}} {{t.perms}}</span><span style="width: 120px; height: 4px; border-radius: 9999px; background: var(--muted); overflow: hidden;"><span style="{{grantBar}}"></span></span></span>
            </div>
          </div>
          <div style="padding: 10px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border-bottom: 1px solid var(--border);">
            <input class="input" aria-label="{{t.search}}" placeholder="{{t.search}}" value="{{q}}" onInput="{{onQ}}" style="width: 260px;">
            <button type="button" class="btn btn-ghost btn-sm" onClick="{{expandAll}}">{{t.expandAll}}</button>
            <button type="button" class="btn btn-ghost btn-sm" onClick="{{collapseAll}}">{{t.collapseAll}}</button>
            <span style="flex: 1;"></span>
            <label style="display: flex; align-items: center; gap: 6px; font-size: 13px;"><input type="checkbox" checked="{{onlyGranted}}" onChange="{{flipOnly}}" style="accent-color: var(--primary);">{{t.onlyGranted}}</label>
          </div>
          <sc-if value="{{cur.system}}" hint-placeholder-val="{{false}}">
            <div style="margin: 12px 18px 0; padding: 10px 12px; border-radius: 8px; background: var(--muted); font-size: 13px;" class="muted">{{t.systemNote}}</div>
          </sc-if>
          <ul role="tree" aria-label="{{t.perms}}" aria-multiselectable="true" style="margin: 0; padding: 10px 12px 16px; list-style: none;">
            <sc-for list="{{nodes}}" as="n" hint-placeholder-count="12">
              <li role="treeitem" aria-level="{{n.level}}" aria-expanded="{{n.expanded}}" aria-checked="{{n.aria}}" class="node" style="{{n.indent}}">
                <sc-if value="{{n.hasKids}}" hint-placeholder-val="{{true}}"><button type="button" class="tw" onClick="{{n.toggle}}" aria-label="{{n.twLabel}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="{{n.chev}}"><path d="m9 18 6-6-6-6"></path></svg></button></sc-if>
                <sc-if value="{{n.isLeaf}}" hint-placeholder-val="{{false}}"><span style="width: 20px; flex: none;"></span></sc-if>
                <button type="button" role="checkbox" aria-checked="{{n.aria}}" aria-label="{{n.label}}" class="chk" onClick="{{n.flip}}" disabled="{{n.locked}}" style="{{n.boxStyle}}">
                  <sc-if value="{{n.on}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
                  <sc-if value="{{n.mixed}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M5 12h14"></path></svg></sc-if>
                </button>
                <span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;">
                  <span style="{{n.labelStyle}}">{{n.label}}</span>
                  <sc-if value="{{n.danger}}" hint-placeholder-val="{{false}}"><span class="badge" style="height: 18px; font-size: 11px; background: var(--destructive-soft); color: var(--destructive);">{{t.danger}}</span></sc-if>
                  <sc-if value="{{n.hasKids}}" hint-placeholder-val="{{true}}"><span class="mono muted" style="font-size: 11.5px;">{{n.count}}</span></sc-if>
                </span>
                <span class="mono muted" style="font-size: 12px;">{{n.key}}</span>
              </li>
            </sc-for>
          </ul>
          <div style="position: sticky; bottom: 0; padding: 12px 18px; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--border); background: var(--card);">
            <span class="muted" style="flex: 1; font-size: 13px;">{{t.applies}}</span>
            <button type="button" class="btn btn-outline">{{t.discard}}</button>
            <button type="button" class="btn btn-default" disabled="{{cur.system}}" style="{{saveStyle}}">{{t.save}}</button>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["vi","en"],"default":"vi"},"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const P = (key, vi, en, kids, danger) => ({ key, l: [vi, en], kids, danger });
    this.tree = [
      P('work', 'Công việc', 'Work', [
        P('tasks', 'Bảng việc', 'Board', [P('tasks.read', 'Xem việc', 'View tasks'), P('tasks.create', 'Tạo và sửa việc', 'Create and edit tasks'), P('tasks.assign', 'Giao việc cho agent', 'Assign to agents'), P('tasks.delete', 'Xoá việc', 'Delete tasks')]),
        P('runs', 'Lượt chạy', 'Runs', [P('runs.read', 'Xem run và log', 'View runs and logs'), P('runs.retry', 'Chạy lại', 'Retry'), P('runs.cancel', 'Huỷ run', 'Cancel runs')]),
        P('plans', 'Kế hoạch', 'Plans', [P('plans.read', 'Xem kế hoạch', 'View plans'), P('plans.decide', 'Duyệt hoặc từ chối', 'Approve or reject')]),
        P('leader', 'Leader', 'Leader', [P('leader.chat', 'Trò chuyện với leader', 'Chat with the leader'), P('leader.approve', 'Duyệt đề xuất của leader', 'Approve leader proposals')]),
      ]),
      P('knowledge', 'Kiến thức', 'Knowledge', [
        P('docs', 'Tài liệu', 'Docs', [P('docs.read', 'Xem', 'View'), P('docs.write', 'Sửa trực tiếp', 'Edit directly'), P('docs.delete', 'Xoá', 'Delete')]),
        P('skills', 'Skills', 'Skills', [P('skills.read', 'Xem', 'View'), P('skills.write', 'Sửa trực tiếp', 'Edit directly')]),
        P('memory', 'Memory', 'Memory', [P('memory.read', 'Tìm và xem', 'Search and view'), P('memory.write', 'Viết', 'Write'), P('memory.approve', 'Duyệt memory của agent', 'Approve agent memories')]),
        P('proposals', 'Đề xuất sửa', 'Proposals', [P('proposals.create', 'Tạo đề xuất', 'Create'), P('proposals.decide', 'Duyệt đề xuất', 'Decide')]),
      ]),
      P('projects', 'Dự án và hạ tầng', 'Projects & infra', [
        P('project', 'Dự án', 'Projects', [P('projects.read', 'Xem dự án', 'View projects'), P('projects.create', 'Tạo dự án', 'Create projects'), P('projects.settings', 'Sửa cấu hình', 'Edit settings'), P('projects.archive', 'Lưu trữ dự án', 'Archive projects')]),
        P('merge', 'Merge', 'Merge', [P('merge.enqueue', 'Đưa PR vào hàng merge', 'Enqueue PRs'), P('merge.force', 'Merge bỏ qua hàng', 'Merge bypassing the queue', null, true)]),
        P('fleet', 'Máy', 'Machines', [P('machines.read', 'Xem máy', 'View machines'), P('machines.register', 'Tạo token đăng ký máy', 'Create registration tokens'), P('machines.remove', 'Gỡ máy', 'Remove machines')]),
        P('sandbox', 'Sandbox', 'Sandbox', [P('sandbox.read', 'Xem allowlist', 'View allowlist'), P('sandbox.write', 'Sửa allowlist và image', 'Edit allowlist and image')]),
      ]),
      P('agents', 'Quản trị agent', 'Agent governance', [
        P('mcp', 'MCP và công cụ', 'MCP & tools', [P('mcp.tokens', 'Cấp token MCP cho mình', 'Issue own MCP tokens'), P('mcp.servers', 'Quản lý MCP server được phép', 'Manage allowed MCP servers')]),
        P('policy', 'Chính sách', 'Policies', [P('policies.write', 'Sửa chính sách agent', 'Edit agent policies'), P('policies.fullaccess', 'Cho phép CLI toàn quyền', 'Allow full-access CLI', null, true)]),
      ]),
      P('access', 'Người và quyền', 'People & access', [
        P('members', 'Thành viên', 'Members', [P('members.read', 'Xem thành viên', 'View members'), P('members.invite', 'Mời người', 'Invite'), P('members.lock', 'Khoá tài khoản', 'Lock accounts'), P('members.role', 'Đổi vai trò', 'Change roles')]),
        P('teams', 'Đội', 'Teams', [P('teams.create', 'Tạo đội', 'Create teams'), P('teams.manage', 'Quản lý thành viên đội', 'Manage team members')]),
        P('roles', 'Vai trò', 'Roles', [P('roles.write', 'Tạo và sửa vai trò', 'Create and edit roles', null, true)]),
        P('sso', 'Đăng nhập', 'Sign-in', [P('signin.write', 'Cấu hình SSO', 'Configure SSO', null, true)]),
      ]),
      P('ops', 'Theo dõi', 'Monitoring', [
        P('costs', 'Chi phí', 'Costs', [P('costs.read', 'Xem chi phí', 'View costs'), P('costs.budget', 'Đặt ngân sách', 'Set budgets')]),
        P('audit', 'Nhật ký', 'Audit log', [P('audit.read', 'Xem nhật ký', 'View audit log'), P('audit.export', 'Xuất nhật ký', 'Export audit log')]),
      ]),
    ];
    const leaves = []; const walk = (n) => (n.kids ? n.kids.forEach(walk) : leaves.push(n.key)); this.tree.forEach(walk);
    this.leaves = leaves;
    const pick = (pred) => { const o = {}; leaves.forEach((k) => { o[k] = pred(k); }); return o; };
    const viewer = (k) => /\.read$/.test(k) || k === 'plans.read';
    const member = (k) => viewer(k) || ['tasks.create', 'tasks.assign', 'runs.retry', 'runs.cancel', 'plans.decide', 'leader.chat', 'memory.write', 'proposals.create', 'merge.enqueue', 'mcp.tokens'].includes(k);
    this.roles = [
      { id: 'owner', g: 'org', name: ['Chủ sở hữu', 'Owner'], desc: ['Toàn quyền với tổ chức, kể cả xoá tổ chức.', 'Full control, including deleting the organization.'], n: 1, system: true, perms: pick(() => true) },
      { id: 'admin', g: 'org', name: ['Quản trị', 'Admin'], desc: ['Quản trị người, đội, dự án và chính sách.', 'Manages people, teams, projects and policies.'], n: 3, system: true, perms: pick((k) => k !== 'policies.fullaccess') },
      { id: 'member', g: 'org', name: ['Thành viên', 'Member'], desc: ['Làm việc trong các đội mình thuộc.', 'Works inside their teams.'], n: 18, system: true, perms: pick(member) },
      { id: 'teamAdmin', g: 'team', name: ['Quản trị đội', 'Team admin'], desc: ['Quản lý người, hệ thống và dự án của đội.', 'Manages the team’s people, systems and projects.'], n: 4, system: true, perms: pick((k) => member(k) || ['projects.create', 'projects.settings', 'teams.manage', 'docs.write', 'skills.write', 'memory.approve', 'proposals.decide', 'sandbox.write', 'costs.budget', 'machines.register'].includes(k)) },
      { id: 'viewer', g: 'team', name: ['Chỉ xem', 'Viewer'], desc: ['Xem việc, run và tài liệu của đội.', 'Views the team’s tasks, runs and docs.'], n: 6, system: true, perms: pick(viewer) },
      { id: 'reviewer', g: 'custom', name: ['Người duyệt merge', 'Merge reviewer'], desc: ['Duyệt kế hoạch, đề xuất và đưa PR vào hàng merge.', 'Reviews plans and proposals and enqueues PRs.'], n: 2, system: false, perms: pick((k) => viewer(k) || ['plans.decide', 'proposals.decide', 'merge.enqueue', 'memory.approve'].includes(k)) },
      { id: 'auditor', g: 'custom', name: ['Kiểm toán', 'Auditor'], desc: ['Chỉ xem chi phí và nhật ký.', 'Views costs and the audit log only.'], n: 1, system: false, perms: pick((k) => ['costs.read', 'audit.read', 'audit.export', 'members.read'].includes(k)) },
    ];
    this.state = { role: 'reviewer', perms: {}, collapsed: { ops: true, access: false }, q: '', only: false, lang: null, dark: null };
  }
  renderVals() {
    const lang = this.state.lang ?? this.props.lang ?? 'vi';
    const dark = this.state.dark ?? !!this.props.dark;
    const en = lang === 'en';
    const x = (p) => (en ? p[1] : p[0]);
    const T = {
      crumb: ['Người và quyền', 'People & access'], title: ['Vai trò và quyền', 'Roles & permissions'],
      lead: ['Mỗi vai trò là một tập quyền. Bật một nhánh là bật mọi quyền con của nhánh đó.', 'A role is a set of permissions. Checking a branch grants every permission under it.'],
      newRole: ['Vai trò mới', 'New role'], roles: ['Vai trò', 'Roles'], systemRole: ['Vai trò hệ thống', 'System role'], perms: ['quyền', 'permissions'],
      search: ['Tìm quyền…', 'Search permissions…'], expandAll: ['Mở hết', 'Expand all'], collapseAll: ['Thu gọn', 'Collapse all'], onlyGranted: ['Chỉ hiện quyền đang bật', 'Only granted'],
      systemNote: ['Vai trò hệ thống không sửa được. Nhân bản thành vai trò mới nếu cần tập quyền khác.', 'System roles cannot be edited. Duplicate one into a new role for a different set.'],
      danger: ['nhạy cảm', 'sensitive'], applies: ['Áp dụng ngay cho mọi người có vai trò này.', 'Applies immediately to everyone with this role.'], discard: ['Bỏ thay đổi', 'Discard'], save: ['Lưu vai trò', 'Save role'],
    };
    const t = {}; Object.keys(T).forEach((k) => { t[k] = x(T[k]); });
    const S = this.state;
    const role = this.roles.find((r) => r.id === S.role);
    const perms = { ...role.perms, ...(S.perms[role.id] || {}) };
    const leavesOf = (n) => (n.kids ? n.kids.flatMap(leavesOf) : [n.key]);
    const q = S.q.trim().toLowerCase();
    const matches = (n) => !q || (x(n.l) + ' ' + n.key).toLowerCase().includes(q) || (n.kids && n.kids.some(matches));
    const nodes = [];
    const setMany = (keys, v) => { if (role.system) return; const m = { ...(S.perms[role.id] || {}) }; keys.forEach((k) => { m[k] = v; }); this.setState({ perms: { ...S.perms, [role.id]: m } }); };
    const visit = (n, level) => {
      if (!matches(n)) return;
      const ls = leavesOf(n); const on = ls.filter((k) => perms[k]).length;
      if (S.only && on === 0) return;
      const all = on === ls.length; const mixed = on > 0 && !all;
      const open = q ? true : !S.collapsed[n.key];
      const boxOn = all || mixed;
      nodes.push({
        level, label: x(n.l), key: n.kids ? '' : n.key, hasKids: !!n.kids, isLeaf: !n.kids, danger: !!n.danger,
        count: on + '/' + ls.length, on: all, mixed, aria: all ? 'true' : mixed ? 'mixed' : 'false', locked: role.system,
        expanded: n.kids ? (open ? 'true' : 'false') : '', twLabel: (open ? x(['Thu gọn ', 'Collapse ']) : x(['Mở ', 'Expand '])) + x(n.l),
        indent: `padding-left: ${10 + (level - 1) * 22}px;` + (level === 1 ? ' margin-top: 4px;' : ''),
        labelStyle: level === 1 ? 'font-weight: 600;' : level === 2 ? 'font-weight: 500;' : 'color: var(--foreground);',
        chev: 'transition: transform .15s; ' + (open ? 'transform: rotate(90deg);' : ''),
        boxStyle: 'border: 1.5px solid ' + (boxOn ? (n.danger ? 'var(--destructive)' : 'var(--primary)') : 'var(--input)') + '; background: ' + (boxOn ? (n.danger ? 'var(--destructive)' : 'var(--primary)') : 'transparent') + '; color: var(--primary-foreground);' + (role.system ? ' opacity: .55; cursor: not-allowed;' : ''),
        toggle: () => this.setState({ collapsed: { ...S.collapsed, [n.key]: open } }),
        flip: () => setMany(ls, !all),
      });
      if (n.kids && open) n.kids.forEach((c) => visit(c, level + 1));
    };
    this.tree.forEach((n) => visit(n, 1));
    const granted = this.leaves.filter((k) => perms[k]).length;
    const G = { org: ['Tổ chức', 'Organization'], team: ['Đội', 'Team'], custom: ['Tự tạo', 'Custom'] };
    const roleGroups = ['org', 'team', 'custom'].map((g) => ({
      label: x(G[g]),
      roles: this.roles.filter((r) => r.g === g).map((r) => ({
        name: x(r.name), system: r.system, meta: x([r.n + ' người · ' + this.leaves.filter((k) => r.perms[k]).length + ' quyền', r.n + ' people · ' + this.leaves.filter((k) => r.perms[k]).length + ' perms']),
        style: 'display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 0; border-radius: 8px; font: inherit; color: var(--foreground); cursor: pointer; ' + (r.id === S.role ? 'background: var(--accent);' : 'background: transparent;'),
        pick: () => this.setState({ role: r.id }),
      })),
    }));
    const collapsedAll = {}; this.tree.forEach((n) => { collapsedAll[n.key] = true; (n.kids || []).forEach((c) => { collapsedAll[c.key] = true; }); });
    return {
      theme: dark ? 'dark' : 'light', lang, dark, t, roleGroups, nodes, granted, totalLeaves: this.leaves.length,
      grantBar: `display: block; height: 100%; width: ${Math.round(granted / this.leaves.length * 100)}%; background: var(--primary);`,
      cur: { name: x(role.name), desc: x(role.desc), system: role.system, scope: x(G[role.g]) },
      saveStyle: role.system ? 'opacity: .5; cursor: not-allowed;' : '',
      q: S.q, onQ: (e) => this.setState({ q: e.target.value }), onlyGranted: S.only, flipOnly: () => this.setState({ only: !S.only }),
      expandAll: () => this.setState({ collapsed: {} }), collapseAll: () => this.setState({ collapsed: collapsedAll }),
      setLang: (v) => this.setState({ lang: v }), setTheme: (v) => this.setState({ dark: v }),
    };
  }
}
</script>
