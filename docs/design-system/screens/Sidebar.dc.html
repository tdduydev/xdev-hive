<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thanh bên</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xdev-hive/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.grp{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 8px 0 10px;border:0;border-radius:6px;background:transparent;color:var(--sidebar-foreground);font:inherit;font-size:14px;cursor:pointer;text-align:left}
.grp:hover,.sub:hover{background:var(--muted)}
.sub{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px 0 12px;border-radius:6px;text-decoration:none;color:var(--muted-foreground);font-size:13.5px}
</style>
</helmet>
<nav aria-label="{{t.aria}}" style="width: 240px; min-height: 1000px; height: 100%; box-sizing: border-box; padding: 12px 10px; display: flex; flex-direction: column; gap: 14px; background: var(--sidebar); color: var(--sidebar-foreground); border-right: 1px solid var(--border); font-family: var(--font-sans); font-size: 14px;">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px; height: 40px;">
    <dc-import name="Logo" height="40" hint-size="91px,40px"></dc-import>
    <span style="margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px; border: 1px solid var(--border); border-radius: 9999px; color: var(--muted-foreground);">0.151</span>
  </div>
  <button type="button" aria-label="{{t.switchOrg}}" style="display: flex; align-items: center; gap: 10px; padding: 7px 8px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--foreground); font: inherit; text-align: left; cursor: pointer; box-shadow: var(--shadow-sm);">
    <span style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--brand-navy); color: #B8F1FF; font-family: var(--font-mono); font-size: 12px; font-weight: 600;">A</span>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3;"><span style="font-weight: 600;">Acme Software</span><span style="font-size: 12px; color: var(--muted-foreground);">{{t.role}}</span></span>
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 6 3-3 3 3M5 10l3 3 3-3"></path></svg>
  </button>

  <ul role="tree" aria-label="{{t.aria}}" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px;">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
      <li role="treeitem" aria-expanded="{{g.expanded}}">
        <sc-if value="{{g.leaf}}" hint-placeholder-val="{{false}}">
          <a href="{{g.href}}" class="grp" style="{{g.style}}" aria-current="{{g.current}}">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{g.icon}}"></path></svg><span style="flex: 1;">{{g.label}}</span>
          </a>
        </sc-if>
        <sc-if value="{{g.branch}}" hint-placeholder-val="{{true}}">
          <button type="button" class="grp" onClick="{{g.toggle}}" style="{{g.style}}">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{g.icon}}"></path></svg>
            <span style="flex: 1;">{{g.label}}</span>
            <sc-if value="{{g.badge}}" hint-placeholder-val="{{false}}"><span style="font-family: var(--font-mono); font-size: 11px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border-radius: 9999px; background: var(--primary); color: var(--primary-foreground);">{{g.badge}}</span></sc-if>
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="{{g.chev}}"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
          <sc-if value="{{g.open}}" hint-placeholder-val="{{false}}">
            <ul role="group" style="margin: 2px 0 4px 17px; padding: 0 0 0 8px; list-style: none; border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 1px;">
              <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
                <li role="treeitem"><a href="{{it.href}}" class="sub" style="{{it.style}}" aria-current="{{it.current}}"><span style="flex: 1;">{{it.label}}</span><sc-if value="{{it.badge}}" hint-placeholder-val="{{false}}"><span style="font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground);">{{it.badge}}</span></sc-if></a></li>
              </sc-for>
            </ul>
          </sc-if>
        </sc-if>
      </li>
    </sc-for>
  </ul>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
    <div style="padding: 10px 12px; border: 1px dashed var(--border); border-radius: 8px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground);"><span style="width: 6px; height: 6px; border-radius: 9999px; background: var(--success);"></span>{{t.fleet}}</div>
      <div style="height: 4px; background: var(--muted); border-radius: 9999px; overflow: hidden;"><div style="width: 60%; height: 100%; background: var(--primary);"></div></div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 6px 2px; border-top: 1px solid var(--border);">
      <span style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; background: var(--accent); color: var(--accent-foreground); font-size: 12px; font-weight: 600;">TL</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3;"><span style="font-weight: 500;">Trần Lan</span><span style="font-size: 12px; color: var(--muted-foreground);">lan@acme.vn</span></span>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","tasks","runs","leader","docs","skills","memory","proposals","workflows","reviews","projects","machines","sandbox","members","teams","roles","signin","mcp","policies","costs","notifications","audit"],"default":"runs"},"lang":{"editor":"enum","options":["vi","en"],"default":"vi"},"$preview":{"width":240,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: {} }; }
  renderVals() {
    const en = (this.props.lang ?? 'vi') === 'en';
    const x = (p) => (en ? p[1] : p[0]);
    const active = this.props.active ?? 'runs';
    const tree = [
      { id: 'home', label: ['Tổng quan', 'Overview'], href: 'Home.dc.html', icon: 'M2.5 7 8 2.5 13.5 7v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1zM6.5 14v-4h3v4' },
      { id: 'work', label: ['Công việc', 'Work'], icon: 'M2.5 3.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1zM9.5 3.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1z', items: [
        ['tasks', ['Bảng việc', 'Board'], '#'], ['runs', ['Lượt chạy', 'Runs'], 'Main.dc.html', '3'], ['leader', ['Leader', 'Leader'], 'Leader.dc.html', '1']] },
      { id: 'know', label: ['Kiến thức', 'Knowledge'], icon: 'M2.5 3h4a2 2 0 0 1 1.5.7A2 2 0 0 1 9.5 3h4v10h-4a1.5 1.5 0 0 0-1.5 1.5A1.5 1.5 0 0 0 6.5 13h-4zM8 3.7v10.8', items: [
        ['docs', ['Tài liệu', 'Docs'], 'Docs.dc.html'], ['skills', ['Skills', 'Skills'], 'Skills.dc.html'], ['memory', ['Memory', 'Memory'], 'Memory.dc.html'], ['proposals', ['Đề xuất sửa', 'Proposals'], 'Proposals.dc.html', '4'], ['workflows', ['Quy trình duyệt', 'Review workflows'], 'Workflows.dc.html'], ['reviews', ['Chờ tôi duyệt', 'Awaiting my review'], 'DocReview.dc.html', '3']] },
      { id: 'proj', label: ['Dự án và hạ tầng', 'Projects & infra'], icon: 'M2.5 4.5a1 1 0 0 1 1-1h3l1.5 1.5h4.5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z', items: [
        ['projects', ['Dự án', 'Projects'], 'Projects.dc.html'], ['machines', ['Máy', 'Machines'], '#'], ['sandbox', ['Sandbox', 'Sandbox'], 'OrgSandbox.dc.html']] },
      { id: 'agents', label: ['Quản trị agent', 'Agent governance'], icon: 'M6 1.5v3M10 1.5v3M4 4.5h8v3a4 4 0 0 1-8 0zM8 11.5v3', items: [
        ['mcp', ['MCP và công cụ', 'MCP & tools'], 'McpTools.dc.html'], ['policies', ['Chính sách agent', 'Agent policies'], 'Policies.dc.html']] },
      { id: 'access', label: ['Người và quyền', 'People & access'], icon: 'M6 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM1.5 13.5c.5-2.3 2.3-3.5 4.5-3.5s4 1.2 4.5 3.5M11 3.2a2.5 2.5 0 0 1 0 4.6M12.5 10.3c1 .5 1.8 1.6 2 3.2', items: [
        ['members', ['Thành viên', 'Members'], 'Members.dc.html'], ['teams', ['Đội và hệ thống', 'Teams & systems'], 'Teams.dc.html'], ['roles', ['Vai trò và quyền', 'Roles & permissions'], 'Roles.dc.html'], ['signin', ['Đăng nhập', 'Sign-in'], 'LoginSettings.dc.html']] },
      { id: 'ops', label: ['Theo dõi', 'Monitoring'], icon: 'M2.5 13.5h11M4.5 11V8M8 11V4.5M11.5 11V6.5', items: [
        ['costs', ['Chi phí và token', 'Costs & tokens'], '#'], ['notifications', ['Thông báo', 'Notifications'], '#'], ['audit', ['Nhật ký', 'Audit log'], 'Audit.dc.html']] },
    ];
    const onStyle = 'background: var(--accent); color: var(--accent-foreground); font-weight: 600;';
    const groups = tree.map((g) => {
      if (!g.items) {
        const on = g.id === active;
        return { leaf: true, branch: false, label: x(g.label), href: g.href, icon: g.icon, style: on ? onStyle : '', current: on ? 'page' : 'false', expanded: 'false' };
      }
      const hasActive = g.items.some((i) => i[0] === active);
      const open = this.state.open[g.id] ?? hasActive;
      const badge = g.items.reduce((s, i) => s + (i[3] ? Number(i[3]) : 0), 0);
      return {
        leaf: false, branch: true, label: x(g.label), icon: g.icon, open, expanded: open ? 'true' : 'false',
        badge: !open && badge ? String(badge) : '', style: hasActive && !open ? onStyle : (hasActive ? 'font-weight: 600;' : ''),
        chev: 'transition: transform .2s; color: var(--muted-foreground); ' + (open ? 'transform: rotate(90deg);' : ''),
        toggle: () => this.setState({ open: { ...this.state.open, [g.id]: !open } }),
        items: g.items.map(([id, l, href, b]) => ({ label: x(l), href, badge: b || '', current: id === active ? 'page' : 'false', style: id === active ? 'background: var(--accent); color: var(--accent-foreground); font-weight: 600;' : '' })),
      };
    });
    const t = en
      ? { aria: 'Main navigation', switchOrg: 'Switch organization', role: 'Admin', fleet: '3 of 5 machines busy' }
      : { aria: 'Điều hướng chính', switchOrg: 'Đổi tổ chức', role: 'Quản trị', fleet: '3 trên 5 máy đang bận' };
    return { groups, t };
  }
}
</script>
</body>
</html>
