<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["tasks","runs","projects","machines","members","teams","notifications","costs","signin"],"default":"tasks"},"$preview":{"width":240,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'tasks';
    const base = 'display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; text-decoration: none; ';
    const on = base + 'background: var(--sel); color: var(--sel-fg); font-weight: 600;';
    const off = base + 'color: var(--body); font-weight: 500;';
    const keys = ['tasks', 'runs', 'projects', 'machines', 'members', 'teams', 'notifications', 'costs', 'signin'];
    const s = {};
    keys.forEach((k) => { s[k] = k === active ? on : off; });
    return { s };
  }
}
</script>
