<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>App · Tra cứu tri thức</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xdev-hive/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.btn{height:32px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-default{background:var(--primary);color:var(--primary-foreground)}
.btn-outline{background:var(--background);color:var(--foreground);border-color:var(--border)}
.btn-ghost{background:transparent;color:var(--foreground)}
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted-foreground)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hit{display:flex;flex-direction:column;gap:2px;padding:10px 16px;border-top:1px solid var(--border);color:var(--foreground);text-decoration:none;cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;font:inherit;text-align:left;width:100%;box-sizing:border-box}
.hit:first-child{border-top:0}
.hit:hover{background:var(--muted)}
.skel{height:12px;border-radius:6px;background:var(--muted)}
.prose h3{margin:14px 0 4px;font-size:14px}
.prose p{margin:4px 0;font-size:13.5px}
.prose code{font-family:var(--font-mono);font-size:12px;background:var(--muted);padding:1px 5px;border-radius:5px}
.prose pre{margin:8px 0;padding:10px 12px;border-radius:8px;background:var(--muted);font-family:var(--font-mono);font-size:12px;line-height:1.6;overflow:auto}
.prose ol{margin:4px 0;padding-left:20px;font-size:13.5px}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 1440px; height: 900px; box-sizing: border-box; padding: 30px; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #142745 0%, #0F172A 100%); font-family: var(--font-sans); font-size: 14px; line-height: 1.5;">
  <div style="width: 1380px; height: 840px; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: var(--background); color: var(--foreground); border: 1px solid var(--border); box-shadow: 0 30px 60px -12px rgb(0 0 0 / .5);">
    <div style="height: 38px; flex: none; padding: 0 12px; display: flex; align-items: center; gap: 8px; background: var(--muted); border-bottom: 1px solid var(--border);">
      <span aria-hidden="true" style="display: flex; gap: 6px;"><span style="width: 11px; height: 11px; border-radius: 9999px; background: #FF5F57;"></span><span style="width: 11px; height: 11px; border-radius: 9999px; background: #FEBC2E;"></span><span style="width: 11px; height: 11px; border-radius: 9999px; background: #28C840;"></span></span>
      <span class="muted" style="flex: 1; text-align: center; font-size: 12.5px;">xDev Hive · {{t.title}}</span>
      <div style="display: inline-flex; padding: 2px; background: var(--background); border-radius: 7px;"><button type="button" onClick="{{toVi}}" style="{{viS}}">VI</button><button type="button" onClick="{{toEn}}" style="{{enS}}">EN</button></div>
    </div>
    <div style="flex: 1; min-height: 0; display: flex;">
      <dc-import name="AppNav" active="knowledge" role="{{role}}" lang="{{lang}}" hint-size="220px,800px"></dc-import>
      <main style="flex: 1; min-width: 0; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px;">

        <!-- Chỉ dành cho người xem artboard; embedded=true ẩn đi. -->
        <sc-if value="{{showBar}}" hint-placeholder-val="{{true}}">
          <div role="group" aria-label="{{t.designState}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px; border: 1px dashed var(--border); border-radius: 8px; font-size: 12px;">
            <span class="muted">{{t.designState}}</span>
            <sc-for list="{{views}}" as="v" hint-placeholder-count="7">
              <button type="button" onClick="{{v.go}}" aria-pressed="{{v.on}}" style="{{v.style}}">{{v.label}}</button>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{inSearch}}" hint-placeholder-val="{{true}}">
          <div style="max-width: 768px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 18px;">
            <p class="muted" style="margin: 0; font-size: 13.5px;">{{t.lead}}</p>
            <search>
              <form onSubmit="{{noop}}" style="display: flex; align-items: flex-end; gap: 8px;">
                <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0;">
                  <label for="kq" style="font-size: 13px; font-weight: 500;">{{t.search}}</label>
                  <input id="kq" type="search" value="{{query}}" placeholder="{{t.placeholder}}" maxlength="500" style="height: 34px; box-sizing: border-box; border: 1px solid var(--input); border-radius: 8px; background: var(--background); color: var(--foreground); font: inherit; padding: 0 10px;">
                </div>
                <button type="submit" class="btn btn-default" style="height: 34px;">⌕ {{t.submit}}</button>
              </form>
            </search>
            <sc-if value="{{hasError}}" hint-placeholder-val="{{false}}">
              <div role="alert" style="padding: 10px 14px; border-radius: 10px; background: var(--destructive-soft); color: var(--destructive); font-size: 13px;">{{t.error}}</div>
            </sc-if>
            <sc-if value="{{noQuery}}" hint-placeholder-val="{{false}}">
              <div style="padding: 28px 16px; border: 1px dashed var(--border); border-radius: 12px; text-align: center; display: flex; flex-direction: column; gap: 4px;">
                <strong style="font-weight: 600;">{{t.startTitle}}</strong>
                <span class="muted" style="font-size: 13px;">{{t.startBody}}</span>
              </div>
            </sc-if>
            <sc-if value="{{hasQuery}}" hint-placeholder-val="{{true}}">
              <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
                <section aria-label="{{g.title}}" style="display: flex; flex-direction: column; gap: 8px;">
                  <h2 style="margin: 0; font-size: 14px; font-weight: 600;">{{g.title}} <sc-if value="{{g.counted}}" hint-placeholder-val="{{true}}"><span class="muted" style="font-weight: 400;">({{g.count}})</span></sc-if></h2>
                  <div class="card">
                    <sc-if value="{{g.loading}}" hint-placeholder-val="{{false}}"><div aria-busy="true" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;"><div class="skel" style="width: 40%;"></div><div class="skel" style="width: 64%;"></div></div></sc-if>
                    <sc-if value="{{g.none}}" hint-placeholder-val="{{false}}"><p class="muted" style="margin: 0; padding: 12px 16px; font-size: 13px;">{{t.none}}</p></sc-if>
                    <sc-for list="{{g.items}}" as="h" hint-placeholder-count="2">
                      <button type="button" class="hit" onClick="{{h.go}}">
                        <span class="{{h.titleClass}}" style="font-size: 13.5px; font-weight: 500;">{{h.title}}</span>
                        <span class="{{h.subClass}}" style="font-size: 12px; color: var(--muted-foreground);">{{h.sub}}</span>
                      </button>
                    </sc-for>
                  </div>
                </section>
              </sc-for>
            </sc-if>
          </div>
        </sc-if>

        <sc-if value="{{inReader}}" hint-placeholder-val="{{false}}">
          <div style="max-width: 768px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;">
            <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;">
              <button type="button" class="btn btn-ghost" onClick="{{backToSearch}}">← {{t.back}}</button>
              <sc-if value="{{reader.canEdit}}" hint-placeholder-val="{{true}}"><button type="button" class="btn btn-outline">✎ {{t.edit}}</button></sc-if>
            </div>
            <article class="card" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 10px;">
              <header style="display: flex; flex-direction: column; gap: 2px;">
                <h2 style="margin: 0; font-size: 16px; font-weight: 600;" class="{{reader.titleClass}}">{{reader.title}}</h2>
                <span class="mono muted" style="font-size: 12px;">{{reader.meta}}</span>
              </header>
              <div class="prose" style="border-top: 1px solid var(--border); padding-top: 6px;">
                <h3>{{reader.h1}}</h3>
                <p>{{reader.p1}}</p>
                <ol><li>{{reader.s1}}</li><li>{{reader.s2}}</li><li>{{reader.s3}}</li></ol>
                <pre>{{reader.code}}</pre>
                <p>{{reader.p2}}</p>
              </div>
            </article>
          </div>
        </sc-if>
      </main>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["dev","writer","lead"],"default":"dev"},"lang":{"editor":"enum","options":["vi","en"],"default":"vi"},"dark":{"editor":"boolean","default":false},"view":{"editor":"enum","options":["results","start","none","loading","error","doc","skill"],"default":"results"},"embedded":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lang: null, view: null }; }
  renderVals() {
    const lang = this.state.lang ?? this.props.lang ?? 'vi';
    const en = lang === 'en';
    const x = (p) => (en ? p[1] : p[0]);
    // Cả ba hồ sơ đều có docs.read nên đều vào được màn này; nút sửa mở trình soạn, hub quyết định sửa hay chỉ đọc.
    const role = this.props.role ?? 'dev';
    const view = this.state.view ?? this.props.view ?? 'results';
    const t = {
      title: x(['Tra cứu tri thức', 'Knowledge']), designState: x(['Trạng thái thiết kế', 'Design state']),
      lead: x(['Tìm tài liệu đã duyệt, memory và skill của đội. Chỉ đọc; sửa tài liệu ở màn Soạn tài liệu.', "Search your team's approved docs, memory and skills. Read-only; edit docs in Write docs."]),
      search: x(['Tìm tri thức', 'Search knowledge']), placeholder: x(['vd. hoàn tiền, migration, quy ước đặt tên…', 'e.g. refund, migration, naming convention…']), submit: x(['Tìm', 'Search']),
      none: x(['Không có kết quả.', 'No results.']), back: x(['Tra cứu tri thức', 'Knowledge']), edit: x(['Sửa trong trình soạn', 'Edit in the editor']),
      startTitle: x(['Gõ từ khoá để tìm', 'Type a keyword to search']), startBody: x(['Một ô tìm cho tài liệu, memory và skill bạn đọc được. Memory tìm theo từ và theo nghĩa.', 'One box for the docs, memory and skills you can read. Memory is matched by words and by meaning.']),
      error: x(['Không tải được tri thức. Kiểm tra kết nối tới hub rồi tìm lại.', 'Could not load knowledge. Check the connection to the hub and search again.']),
    };
    const ver = (v) => x(['bản ' + v, 'v' + v]);
    const kinds = { decision: x(['Quyết định', 'Decision']), convention: x(['Quy ước', 'Convention']), gotcha: x(['Lưu ý', 'Gotcha']), note: x(['Ghi chú', 'Note']) };
    const isReader = view === 'doc' || view === 'skill';
    const loading = view === 'loading';
    const none = view === 'none';
    const query = view === 'start' ? '' : none ? 'zzz' : x(['hoàn tiền', 'refund']);
    const go = (v) => () => this.setState({ view: v });
    const docs = [
      { title: x(['Quy trình hoàn tiền một phần', 'Partial refund process']), sub: 'payments/refund-process · ' + ver(7), go: go('doc'), titleClass: '', subClass: 'mono' },
      { title: x(['Đối soát giao dịch cuối ngày', 'End-of-day reconciliation']), sub: 'payments/reconcile · ' + ver(3), go: go('doc'), titleClass: '', subClass: 'mono' },
    ];
    const memory = [
      { title: kinds.decision + ' · ' + x(['hoàn tiền không quá 180 ngày kể từ lúc thanh toán', 'refunds stop 180 days after the payment']), sub: 'internal/refund/limits.go', go: () => {}, titleClass: '', subClass: 'mono' },
      { title: kinds.gotcha + ' · ' + x(['cổng trả 202 chứ không phải 200 khi hoàn tiền bất đồng bộ', 'the gateway answers 202, not 200, for async refunds']), sub: 'internal/psp/client.go, internal/refund/service.go', go: () => {}, titleClass: '', subClass: 'mono' },
    ];
    const skills = [
      { title: 'refund-flow', sub: x(['Viết và kiểm thử luồng hoàn tiền theo quy ước của đội', "Write and test refund flows to the team's conventions"]) + ' · ' + ver(2), go: go('skill'), titleClass: 'mono', subClass: '' },
    ];
    const grp = (title, items) => ({ title, items: loading || none ? [] : items, loading, none: none, counted: !loading, count: loading || none ? 0 : items.length });
    const groups = [grp(x(['Tài liệu', 'Docs']), docs), grp('Memory', memory), grp('Skill', skills)];
    const isSkill = view === 'skill';
    const reader = isSkill
      ? { title: 'refund-flow', titleClass: 'mono', meta: x(['Luồng hoàn tiền theo quy ước của đội', "Refund flows to the team's conventions"]) + ' · ' + ver(2), canEdit: false,
          h1: x(['Khi nào dùng', 'When to use']), p1: x(['Khi task đụng tới hoàn tiền, huỷ đơn hay đối soát với cổng thanh toán.', 'When a task touches refunds, order cancellation or reconciliation with the gateway.']),
          s1: x(['Đọc docs/payments/refund-process trước khi sửa.', 'Read docs/payments/refund-process before editing.']), s2: x(['Viết test bảng cho từng trạng thái của cổng.', 'Write table-driven tests for every gateway state.']), s3: x(['Chạy go test ./internal/refund/...', 'Run go test ./internal/refund/...']),
          code: 'go test ./internal/refund/... -run TestRefund', p2: x(['Skill này do tổ chức quản lý; muốn sửa thì đề xuất ở web.', 'This skill is managed by the organization; propose changes on the web.']) }
      : { title: x(['Quy trình hoàn tiền một phần', 'Partial refund process']), titleClass: '', meta: 'payments/refund-process · ' + ver(7), canEdit: true,
          h1: x(['Phạm vi', 'Scope']), p1: x(['Áp dụng cho đơn đã giao, thanh toán bằng thẻ hoặc ví. Hoàn tiền một phần không đổi trạng thái đơn.', 'Applies to delivered orders paid by card or wallet. A partial refund does not change the order state.']),
          s1: x(['Kiểm số tiền còn lại có thể hoàn.', 'Check the amount still refundable.']), s2: x(['Gửi yêu cầu cho cổng với khoá chống trùng.', 'Send the request to the gateway with an idempotency key.']), s3: x(['Ghi bút toán và gửi thông báo cho khách.', 'Post the ledger entry and notify the customer.']),
          code: 'POST /v1/refunds\nIdempotency-Key: <uuid>', p2: x(['Hạn hoàn tiền: 180 ngày kể từ lúc thanh toán.', 'Refund window: 180 days after the payment.']) };
    const seg = (on) => 'height: 22px; min-width: 28px; padding: 0 6px; border: 0; border-radius: 5px; font-family: var(--font-mono); font-size: 11px; cursor: pointer; ' + (on ? 'background: var(--card); color: var(--foreground); font-weight: 600;' : 'background: transparent; color: var(--muted-foreground);');
    const pill = (on) => 'height: 24px; padding: 0 9px; border: 1px solid var(--border); border-radius: 9999px; font: inherit; font-size: 12px; cursor: pointer; ' + (on ? 'background: var(--accent); color: var(--accent-foreground); font-weight: 600;' : 'background: var(--background); color: var(--foreground);');
    const names = { results: ['Kết quả', 'Results'], start: ['Chưa tìm', 'Not searched'], none: ['Không có kết quả', 'No results'], loading: ['Đang tải', 'Loading'], error: ['Lỗi', 'Error'], doc: ['Đọc tài liệu', 'Read a doc'], skill: ['Đọc skill', 'Read a skill'] };
    return {
      theme: this.props.dark ? 'dark' : 'light', lang, role, t, showBar: !this.props.embedded,
      views: Object.keys(names).map((k) => ({ label: x(names[k]), on: String(view === k), style: pill(view === k), go: go(k) })),
      inSearch: !isReader, inReader: isReader, query, noop: (e) => e?.preventDefault?.(),
      hasError: view === 'error', noQuery: view === 'start', hasQuery: view !== 'start' && view !== 'error', groups,
      reader, backToSearch: go('results'),
      viS: seg(!en), enS: seg(en), toVi: () => this.setState({ lang: 'vi' }), toEn: () => this.setState({ lang: 'en' }),
    };
  }
}
</script>
</body>
</html>
