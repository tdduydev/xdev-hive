<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lỗi và không tìm thấy</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xdev-hive/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.btn{height:36px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap;text-decoration:none}
.btn-default{background:var(--primary);color:var(--primary-foreground)}
.btn-outline{background:var(--background);color:var(--foreground);border-color:var(--border)}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted-foreground)}
.seg{display:inline-flex;padding:2px;background:var(--muted);border-radius:8px}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 900px; display: flex; flex-direction: column; background: var(--background); background-image: radial-gradient(var(--border) 1px, transparent 1px); background-size: 20px 20px; color: var(--foreground); font-family: var(--font-sans); font-size: 14px; line-height: 1.5;">
  <div style="padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div class="seg" role="group" aria-label="{{t.kindAria}}"><sc-for list="{{kinds}}" as="k" hint-placeholder-count="3"><button type="button" onClick="{{k.pick}}" aria-pressed="{{k.p}}" style="{{k.s}}">{{k.label}}</button></sc-for></div>
    <div class="seg" role="group" aria-label="{{t.langAria}}"><button type="button" onClick="{{toVi}}" aria-pressed="{{viP}}" style="{{viS}}">VI</button><button type="button" onClick="{{toEn}}" aria-pressed="{{enP}}" style="{{enS}}">EN</button></div>
  </div>
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px 96px;">
    <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px;">
      <sc-if value="{{pending}}" hint-placeholder-val="{{false}}">
        <div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
          <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"></path></svg>
          <span class="muted">{{t.loading}}</span>
        </div>
      </sc-if>
      <sc-if value="{{notPending}}" hint-placeholder-val="{{true}}">
        <span class="mono" style="font-size: 72px; line-height: 1; font-weight: 600; letter-spacing: -0.06em; color: var(--border);">{{code}}</span>
        <dc-import name="Logo" height="48" hint-size="110px,48px"></dc-import>
        <h1 style="margin: 0; font-family: var(--font-heading); font-size: 22px; font-weight: 600; letter-spacing: -0.03em;">{{title}}</h1>
        <p class="muted" style="margin: 0;">{{body}}</p>
        <div style="display: flex; gap: 8px; margin-top: 4px;">
          <sc-if value="{{isError}}" hint-placeholder-val="{{false}}"><button type="button" class="btn btn-default"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"></path><path d="M21 3v6h-6"></path></svg>{{t.retry}}</button></sc-if>
          <sc-if value="{{is404}}" hint-placeholder-val="{{true}}"><a href="Home.dc.html" class="btn btn-default">{{t.home}}</a></sc-if>
        </div>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["notFound","error","pending"],"default":"notFound"},"lang":{"editor":"enum","options":["vi","en"],"default":"vi"},"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lang: null, kind: null }; }
  renderVals() {
    const lang = this.state.lang ?? this.props.lang ?? 'vi';
    const kind = this.state.kind ?? this.props.kind ?? 'notFound';
    const en = lang === 'en';
    const x = (p) => (en ? p[1] : p[0]);
    const T = {
      kindAria: ['Trạng thái mẫu', 'Sample state'], langAria: ['Ngôn ngữ', 'Language'], loading: ['Đang tải…', 'Loading…'], retry: ['Thử lại', 'Try again'], home: ['Về trang chủ', 'Go home'],
    };
    const t = {}; Object.keys(T).forEach((k) => { t[k] = x(T[k]); });
    const C = {
      notFound: ['404', ['Không tìm thấy trang', 'Page not found'], ['Đường dẫn này không có trên hub, hoặc màn hình chưa được làm.', 'This address does not exist on the hub, or the screen is not built yet.']],
      error: ['503', ['Không kết nối được hub', 'Cannot reach the hub'], ['Hub không trả lời hoặc đang gặp lỗi. Kiểm tra mạng, đợi một lát rồi thử lại.', 'The hub is not responding or has an error. Check your network, wait a moment, then try again.']],
      pending: ['', ['', ''], ['', '']],
    }[kind];
    const seg = (on) => 'height: 26px; min-width: 34px; padding: 0 8px; border: 0; border-radius: 6px; font-family: var(--font-mono); font-size: 12px; cursor: pointer; ' + (on ? 'background: var(--card); color: var(--foreground); font-weight: 600; box-shadow: var(--shadow-sm);' : 'background: transparent; color: var(--muted-foreground);');
    const kinds = [['notFound', '404'], ['error', x(['Lỗi', 'Error'])], ['pending', x(['Đang tải', 'Loading'])]].map(([k, l]) => ({ label: l, p: kind === k ? 'true' : 'false', s: seg(kind === k), pick: () => this.setState({ kind: k }) }));
    return {
      theme: this.props.dark ? 'dark' : 'light', t, kinds, code: C[0], title: x(C[1]), body: x(C[2]),
      pending: kind === 'pending', notPending: kind !== 'pending', isError: kind === 'error', is404: kind === 'notFound',
      viP: en ? 'false' : 'true', enP: en ? 'true' : 'false', viS: seg(!en), enS: seg(en),
      toVi: () => this.setState({ lang: 'vi' }), toEn: () => this.setState({ lang: 'en' }),
    };
  }
}
</script>
</body>
</html>
