$('#nav').innerHTML=pages.map(([id,label,icon,group])=>(group?`<div class="group">${group}</div>`:'')+`<button data-page="${id}"><span class="navicon" aria-hidden="true">${icon}</span>${label}</button>`).join('');
function render(){const id=location.hash.slice(1)||'today';$('#main').innerHTML=(screens[id]||screens.today)();document.querySelectorAll('#nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===id);if(b.dataset.page===id)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');document.title='Hive · '+(pages.find(p=>p[0]===id)?.[1]||'Công việc');window.scrollTo(0,0)}
function menu(){const opened=$('#sidebar').classList.toggle('open');$('#menu').setAttribute('aria-expanded',opened);if(opened)$('#sidebar button').focus();else $('#menu').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){location.hash=b.dataset.page}else if(b.dataset.action){$('#dialogTitle').textContent=b.textContent;$('#dialogText').textContent=b.dataset.action;$('#dialog').showModal()}else if(b.dataset.filter){document.querySelectorAll('[data-filter]').forEach(n=>n.classList.toggle('active',n===b));document.querySelectorAll('[data-state]').forEach(n=>n.hidden=b.dataset.filter!=='all'&&n.dataset.state!==b.dataset.filter)}else if(b.id==='theme'){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'}else if(b.id==='menu'||b.id==='more'){menu()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sidebar').classList.contains('open'))menu()});
document.addEventListener('submit',e=>{if(e.target.id!=='chatForm')return;e.preventDefault();const m=document.createElement('div');m.className='message user';m.textContent=$('#message').value;e.target.before(m);$('#message').value='';const a=document.createElement('div');a.className='message';a.textContent='Đã thêm vào cuộc trò chuyện minh hoạ. Prototype chưa kết nối agent.';e.target.before(a)});
$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){location.hash='history';setTimeout(()=>{$('#main').querySelector('h1').textContent='Tìm kiếm: '+e.target.value},0)}});window.addEventListener('hashchange',render);render();
</script></body></html>
