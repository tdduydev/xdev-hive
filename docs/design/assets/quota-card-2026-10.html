/* ---- Mockup UX-quota-card-design. Chỉ dùng token ở trên; app dựng bằng Tailwind + components/ui. ---- */
*{box-sizing:border-box}
body{margin:0;background:var(--bg-canvas);color:var(--text-primary);font:var(--type-body-sm);-webkit-font-smoothing:antialiased}
main{max-width:var(--content-max);margin:0 auto;padding:var(--space-6) var(--gutter)}
@media (max-width:767px){main{padding:var(--space-4) var(--gutter-mobile)}}
h1{font:var(--type-heading-lg);color:var(--text-strong);margin:0 0 var(--space-1)}
h2{font:var(--type-heading-sm);color:var(--text-strong);margin:var(--space-6) 0 var(--space-3)}
.lead{color:var(--text-muted);margin:0 0 var(--space-2)}
.grid{display:grid;gap:var(--space-3);align-items:start}
.grid.full{grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr))}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
svg.i{width:var(--icon-sm);height:var(--icon-sm);flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Card */
.qc{container-type:inline-size;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);display:flex;flex-direction:column;min-width:0}
.qc[data-state=off]{opacity:.72}
.qc>section{padding:var(--space-3) var(--space-4)}
.qc>section+section{border-top:1px solid var(--border-subtle)}
.hd{display:flex;align-items:flex-start;gap:var(--space-2)}
.who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.name{display:flex;align-items:baseline;gap:var(--space-1);min-width:0;font:var(--type-heading-sm);color:var(--text-strong)}
.name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.name small{font:var(--type-caption);font-weight:400;color:var(--text-muted);white-space:nowrap}
.sub{font:var(--type-caption);font-weight:400;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub code{font:var(--type-code-sm)}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--radius-full);font:var(--type-caption);white-space:nowrap;flex:none}
.chip.success{background:var(--status-success-bg);color:var(--status-success-fg)}
.chip.warning{background:var(--status-warning-bg);color:var(--status-warning-fg)}
.chip.danger{background:var(--status-danger-bg);color:var(--status-danger-fg)}
.chip.running{background:var(--status-running-bg);color:var(--status-running-fg)}
.chip.neutral{background:var(--status-neutral-bg);color:var(--status-neutral-fg)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:var(--control-h-sm);height:var(--control-h-sm);border-radius:var(--radius-sm);border:0;background:transparent;color:var(--text-muted);flex:none}
.ib svg.i{width:var(--icon-md);height:var(--icon-md)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--control-h-sm);padding:0 12px;border-radius:var(--radius-sm);font:var(--type-label);white-space:nowrap;border:1px solid transparent;flex:none}
.btn.primary{background:var(--action-primary-bg);color:var(--action-primary-fg)}
.btn.secondary{background:var(--action-secondary-bg);color:var(--action-secondary-fg);border-color:var(--action-secondary-border)}
@media (max-width:767px){.ib,.btn{min-height:var(--control-h-touch)}.ib{min-width:var(--control-h-touch)}}

/* Block banner: the one thing a blocked card says first */
.block{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-3);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3);margin:0 var(--space-4) var(--space-3)}
.block.warning{background:var(--status-warning-bg);color:var(--status-warning-fg)}
.block.danger{background:var(--status-danger-bg);color:var(--status-danger-fg)}
.block .txt{flex:1 1 200px;min-width:0;display:flex;gap:var(--space-2)}
.block .txt svg.i{margin-top:3px}
.block strong{display:block;font:var(--type-label);font-weight:600}
.block span{display:block;font:var(--type-caption);font-weight:400}
.block .cause{color:var(--text-secondary)}

/* Limits */
.limits{display:grid;gap:var(--space-3)}
@container (min-width:440px){.limits{grid-template-columns:1fr 1fr;gap:var(--space-4)}}
.lim{display:flex;flex-direction:column;gap:6px;min-width:0}
.lim .top{display:flex;align-items:baseline;gap:var(--space-2)}
.lim .lbl{font:var(--type-caption);color:var(--text-secondary)}
.lim .pct{margin-left:auto;font:var(--type-code-md);font-weight:600;color:var(--text-strong)}
.lim .pct.near{color:var(--status-warning-fg)}.lim .pct.over{color:var(--status-danger-fg)}
.bar{position:relative;height:6px;border-radius:3px;background:var(--bg-sunken);box-shadow:inset 0 0 0 1px var(--border-default)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--action-primary-bg)}
.bar i.near{background:var(--status-warning-fg)}.bar i.over{background:var(--status-danger-fg)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-muted);border-radius:1px}
.lim .when{font:var(--type-caption);font-weight:400;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lim .when em{font-style:normal;color:var(--text-secondary);font-weight:500}
.unk{display:flex;flex-direction:column;gap:6px}
.unk .bar{background:repeating-linear-gradient(135deg,var(--bg-sunken) 0 4px,transparent 4px 8px)}

/* Outlook */
.outlook{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3);margin:0}
.outlook div{min-width:0}
.outlook dt{font:var(--type-caption);font-weight:400;color:var(--text-muted)}
.outlook dd{margin:2px 0 0;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.outlook dd b{font:var(--type-heading-md);font-family:var(--font-display);color:var(--text-strong)}
.outlook dd b.dim{color:var(--text-muted);font-weight:500}
.outlook dd small{font:var(--type-caption);font-weight:400;color:var(--text-muted)}
.ceiling{display:flex;gap:6px;align-items:flex-start;margin-top:var(--space-2);font:var(--type-caption);color:var(--status-warning-fg)}
.ceiling svg.i{margin-top:1px}
.how{margin-top:var(--space-2);font:var(--type-caption);font-weight:400;color:var(--text-link);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:2px}
@media (max-width:767px){.how{min-height:var(--control-h-touch)}}

/* Footer */
.ft{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);font:var(--type-caption);font-weight:400;color:var(--text-muted)}
.ft .asof{margin-left:auto}
.ft .hit{color:var(--status-warning-fg);font-weight:500}

/* Compact density */
.qc.c>section{padding:var(--space-3)}
.qc.c .hd{align-items:center}
.cl{display:grid;grid-template-columns:auto minmax(0,1fr) 3.2em;align-items:center;gap:6px var(--space-2);margin-top:var(--space-2);font:var(--type-caption);font-weight:400;color:var(--text-secondary)}
.cl .pct{text-align:right;font:var(--type-code-sm);font-weight:600;color:var(--text-strong)}
.cl .pct.near{color:var(--status-warning-fg)}.cl .pct.over{color:var(--status-danger-fg)}
.cl .pct.unk{color:var(--text-muted);font-weight:400}
.cline{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-2);font:var(--type-caption);font-weight:400;color:var(--text-muted)}
.cline .t{flex:1 1 140px;min-width:0}
.cline.warning .t{color:var(--status-warning-fg);font-weight:500}
.cline.danger .t{color:var(--status-danger-fg);font-weight:500}
.offline{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);border:1px dashed var(--border-default);border-radius:var(--radius-lg);font:var(--type-caption);font-weight:400;color:var(--text-muted)}
.note{font:var(--type-caption);font-weight:400;color:var(--text-muted);margin-top:var(--space-6)}
</style>

const f = (s, v = {}) => s.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? T[k] ?? `{${k}}`);

const CHIP = { ready: ["success", "ok"], running: ["running", "run"], near: ["warning", "near"], resting: ["warning", "pause"], threshold: ["warning", "gauge"], spend: ["danger", "ban"], signedOut: ["danger", "login"], noCli: ["danger", "off"], off: ["neutral", "off"], offline: ["neutral", "wifi"] };
const chip = (st, v) => `<span class="chip ${CHIP[st][0]}">${ic(CHIP[st][1])}${f(T.state[st], v)}</span>`;
const tone = (p, stop) => (p >= stop ? "over" : p >= stop - 10 ? "near" : "ok");

function limit(name, l) {
  if (!l.known) return `<div class="lim unk"><div class="top"><span class="lbl">${name}</span><span class="pct" style="font:var(--type-caption);color:var(--text-muted)">${T.unknown}</span></div><div class="bar"></div><span class="when">${T.why[l.why]}</span></div>`;
  const tn = tone(l.p, l.stop);
  return `<div class="lim"><div class="top"><span class="lbl">${name}</span><span class="pct ${tn}">${l.p}%</span></div>
    <div class="bar" role="meter" aria-valuenow="${l.p}"><i class="${tn}" style="width:${l.p}%"></i><b style="left:calc(${l.stop}% - 1px)"></b></div>
    <span class="when">${f(T.resets, { time: T[l.at], left: T[l.left] })}</span></div>`;
}

function full(c) {
  const head = `<section class="hd"><div class="who"><span class="name"><b>${c.label}</b>${c.plan ? `<small>· ${c.plan}</small>` : ""}</span><span class="sub">${c.sub}</span></div>
    ${chip(c.state, c.chipVars)}<button class="ib" aria-label="${f(T.read, c)}">${ic("refresh")}</button><button class="ib" aria-label="${f(T.menu, c)}">${ic("more")}</button></section>`;
  const block = c.block
    ? `<div class="block ${c.block.tone}"><div class="txt">${ic(c.block.icon)}<div><strong>${T.noNew}</strong><span>${c.block.line}</span><span class="cause">${c.block.cause}</span></div></div>${c.block.action ? `<button class="btn ${c.block.action === "resume" ? "primary" : "primary"}">${T[c.block.action]}</button>` : ""}</div>`
    : "";
  const lims = `<section><div class="limits">${limit(T.session, c.session)}${limit(T.week, c.week)}</div></section>`;
  const o = c.outlook;
  const out = `<section><dl class="outlook">
    <div><dt>${T.resetsLeft}</dt><dd>${o.resets == null ? `<b class="dim">—</b>` : `<b>${o.resets}</b>`}<small>${o.resets == null ? T.lack : f(T.untilWeek, { time: T[o.weekAt] })}</small></dd></div>
    <div><dt>${T.fullLeft}</dt><dd>${o.full == null ? `<b class="dim">—</b><small>${T.lack}</small>` : `<b>~${o.full}</b><small>${T.estimate}</small>`}</dd></div>
    <div><dt>${T.credits}</dt><dd>${o.credits === "none" ? `<b class="dim">—</b><small>${T.noCredits}</small>` : o.credits === "unlimited" ? `<b>∞</b><small>${T.unlimited}</small>` : `<b>${o.credits}</b><small>${T.codexCredits}</small>`}</dd></div>
  </dl>${o.ceiling ? `<div class="ceiling">${ic("near")}<span>${T.ceiling}</span></div>` : ""}<button class="how">${T.how}</button></section>`;
  const k = c.counts;
  const foot = `<section class="ft"><span>${f(T.counts, { ...k, hitCls: k.hit ? "hit" : "", since: k.since ? f(T.since, { date: T[k.since] }) : T.sinceStart })}</span><span class="asof">${c.asOfRun ? f(T.asOfRun, { time: T[c.asOfRun] }) : f(T.asOf, { time: T.t1318 })}</span></section>`;
  return `<article class="qc" data-quota-card="${c.id}" data-density="full" data-state="${c.state}">${head}${block}${lims}${o.hidden ? "" : out}${foot}</article>`;
}

function compact(c) {
  const row = (name, l) => !l.known
    ? `<span>${name}</span><div class="bar" style="background:repeating-linear-gradient(135deg,var(--bg-sunken) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1px var(--border-default)"></div><span class="pct unk">—</span>`
    : `<span>${name}</span><div class="bar"><i class="${tone(l.p, l.stop)}" style="width:${l.p}%"></i><b style="left:calc(${l.stop}% - 1px)"></b></div><span class="pct ${tone(l.p, l.stop)}">${l.p}%</span>`;
  const line = c.line
    ? `<div class="cline ${c.line.tone || ""}"><span class="t">${c.line.text}</span>${c.line.action ? `<button class="btn secondary">${T[c.line.action]}</button>` : ""}</div>`
    : "";
  return `<article class="qc c" data-quota-card="${c.id}" data-density="compact" data-state="${c.state}"><section>
    <div class="hd"><div class="who"><span class="name"><b>${c.label}</b>${c.plan ? `<small>· ${c.plan}</small>` : ""}</span><span class="sub">${c.sub}</span></div>${chip(c.state, c.chipVars)}</div>
    <div class="cl">${row(T.s, c.session)}${row(T.w, c.week)}</div>${line}</section></article>`;
}
