<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-canvas);color:var(--text-primary);font:var(--type-body-md)}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.c{display:flex;flex-direction:column;gap:4px;font:var(--type-code-sm);font-size:11px;color:var(--text-muted)}.s{width:72px;height:44px;border-radius:6px;border:1px solid var(--border-subtle)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;font:var(--type-code-sm);font-size:11px;color:var(--text-muted)"><div style="padding:10px;border-radius:8px;background:var(--bg-surface);border:1px solid var(--border-subtle)"><div style="font:600 18px/24px var(--font-display);color:var(--text-strong)">80ms</div>instant</div><div style="padding:10px;border-radius:8px;background:var(--bg-surface);border:1px solid var(--border-subtle)"><div style="font:600 18px/24px var(--font-display);color:var(--text-strong)">120ms</div>fast</div><div style="padding:10px;border-radius:8px;background:var(--bg-surface);border:1px solid var(--border-subtle)"><div style="font:600 18px/24px var(--font-display);color:var(--text-strong)">180ms</div>base</div><div style="padding:10px;border-radius:8px;background:var(--bg-surface);border:1px solid var(--border-subtle)"><div style="font:600 18px/24px var(--font-display);color:var(--text-strong)">240ms</div>slow</div><div style="padding:10px;border-radius:8px;background:var(--bg-surface);border:1px solid var(--border-subtle)"><div style="font:600 18px/24px var(--font-display);color:var(--text-strong)">320ms</div>slower</div></div></body></html>
