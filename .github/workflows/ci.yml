name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (lint, typecheck, ranh giới, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm deps
      - run: pnpm test
      - run: pnpm build
      - name: openapi.json khớp hợp đồng
        run: pnpm openapi && git diff --exit-code packages/contracts/openapi.json

  worker:
    name: Worker Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Worker chạy trên máy dev của cả ba hệ điều hành, nên test đủ ba ngay từ đầu.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: worker/go.mod
          cache: false
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/ ./cmd/hive-worker

  e2e:
    name: E2E smoke (Git cục bộ, CLI giả)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Script build worker Go rồi chạy thật trên runner.
      - uses: actions/setup-go@v7
        with:
          go-version-file: worker/go.mod
          cache: false
      - run: pnpm install --frozen-lockfile
      # Chế độ mặc định: Postgres qua Testcontainers (Docker có sẵn trên runner), không ra mạng ngoài.
      - run: pnpm e2e:smoke

  image:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: xdev-hive:ci

  desktop:
    name: Desktop Tauri (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Thư viện hệ thống cho Tauri trên Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo check --locked
        working-directory: apps/desktop/src-tauri
