name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (lint, typecheck, ranh giới, test, build)
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","Linux","X64","hive-ci"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # Mặc định ~/setup-pnpm dùng chung giữa các runner cùng user trên một máy, chạy song song thì dẫm nhau.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm deps
      - run: pnpm test
      - run: pnpm build
      - name: openapi.json khớp hợp đồng
        run: pnpm openapi && git diff --exit-code packages/contracts/openapi.json

  worker:
    name: Worker Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Worker chạy trên máy dev của cả ba hệ điều hành. Runner GitHub-hosted đang bị chặn vì billing nên mặc định dùng
        # runner tự host (chưa có máy Windows); đặt biến repo CI_WORKER_RUNNERS để thêm windows-latest khi có lại.
        include: ${{ fromJSON(vars.CI_WORKER_RUNNERS || '[{"os":"linux","runner":["self-hosted","Linux","X64","hive-ci"]},{"os":"macos","runner":["self-hosted","macOS","ARM64","hive-ci"]}]') }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: worker/go.mod
          cache: false
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/ ./cmd/hive-worker

  e2e:
    name: E2E smoke (Git cục bộ, CLI giả)
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","Linux","X64","hive-ci"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # Mặc định ~/setup-pnpm dùng chung giữa các runner cùng user trên một máy, chạy song song thì dẫm nhau.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Script build worker Go rồi chạy thật trên runner.
      - uses: actions/setup-go@v7
        with:
          go-version-file: worker/go.mod
          cache: false
      - run: pnpm install --frozen-lockfile
      # Chế độ mặc định: Postgres qua Testcontainers (Docker có sẵn trên runner), không ra mạng ngoài.
      - run: pnpm e2e:smoke

  image:
    name: Docker image (build only)
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","Linux","X64","hive-ci"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # Runner tự host tải ảnh ẩn danh từ IP máy chủ nên hay gặp 429 của Docker Hub; lấy cùng ảnh Node qua mirror ECR.
      - name: Ảnh Node qua mirror
        id: node
        run: echo "image=public.ecr.aws/docker/library/$(sed -n 's/^ARG NODE_IMAGE=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: xdev-hive:ci
          build-args: NODE_IMAGE=${{ steps.node.outputs.image }}

  desktop:
    name: Desktop Tauri (cargo check, test)
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","Linux","X64","hive-ci"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Thư viện hệ thống cho Tauri trên Linux
        # Runner tự host không có sudo không mật khẩu: chỉ cài khi thiếu và có quyền, không thì báo lệnh cài một lần.
        run: |
          pkgs="build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev"
          missing=""
          for p in $pkgs; do dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"; done
          [ -z "$missing" ] && exit 0
          if sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y $missing
          else
            echo "::error::Runner thiếu gói:$missing. Cài một lần trên máy runner: sudo apt-get install -y$missing"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v7
        with:
          go-version-file: worker/go.mod
          cache: false
      # Các runner tự host trên cùng máy dùng chung $HOME: cargo/rustup chung thư mục thì build song song làm hỏng registry.
      - name: CARGO_HOME và RUSTUP_HOME riêng cho runner
        run: |
          echo "CARGO_HOME=$RUNNER_TOOL_CACHE/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TOOL_CACHE/rustup" >> "$GITHUB_ENV"
          echo "$RUNNER_TOOL_CACHE/cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # tauri-build đòi có sẵn sidecar (externalBin) và thư mục frontend lúc biên dịch.
      - name: Dựng giao diện đăng ký và sidecar hive-worker
        run: node apps/desktop/scripts/build-frontend.ts && node apps/desktop/scripts/build-sidecar.ts
      - run: cargo check --locked
        working-directory: apps/desktop/src-tauri
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri
