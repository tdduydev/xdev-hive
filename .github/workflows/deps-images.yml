# Third-party images the hub's compose files run (Caddy, SeaweedFS), rebuilt from their upstream release with a
# current Go so they pass the same vulnerability scan as the hub image. A pull request builds and scans them; main
# also pushes them to ghcr.io/tdduydev/xdev-hive-<name>:<version>. Weekly, the same versions are rebuilt so a new Go
# patch release reaches them without anyone touching this file.
name: Dependency images
on:
  pull_request:
    paths: [deploy/images/**, .github/workflows/deps-images.yml]
  push:
    branches: [main]
    paths: [deploy/images/**, .github/workflows/deps-images.yml]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: deps-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: caddy
            version: 2.11.7
            arg: CADDY_VERSION=v2.11.7
          - name: seaweedfs
            version: "4.48"
            arg: SEAWEEDFS_VERSION=4.48
    env:
      IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (loaded for the scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/images/${{ matrix.name }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ matrix.name }}:scan
          build-args: ${{ matrix.arg }}
          labels: |
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=deps-${{ matrix.name }}
          cache-to: type=gha,scope=deps-${{ matrix.name }},mode=max
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:scan
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        name: Push ${{ matrix.version }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/images/${{ matrix.name }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.version }}
          build-args: ${{ matrix.arg }}
          labels: |
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=deps-${{ matrix.name }}
          provenance: false
          sbom: false
