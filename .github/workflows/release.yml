name: Release

# Ba cách phát hành, cùng một chuỗi job:
# - Cập nhật nhánh `release` (merge hoặc fast-forward từ main): job `prepare` tự tính phiên bản (file VERSION, không thì
#   tăng patch của tag mới nhất) rồi tạo tag `v<phiên bản>` trên commit đó. Commit đã có tag thì bỏ qua.
# - Đẩy tag `v*` bằng tay (cách cũ): chạy ngay trên tag đó, giữ nguyên hành vi trước đây.
# - Nút Actions → Release → Run workflow: nhập phiên bản (x.y.z) và ghi chú tuỳ chọn; job `prepare` tạo tag
#   `v<phiên bản>` trên commit của main rồi các job sau chạy trên tag đó.
# Ghi chú phát hành viết bằng tiếng Anh: scripts/release/notes.sh chọn nguồn (ô nhập > RELEASE_NOTES.md > tự sinh từ PR).
on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version x.y.z without the leading v (e.g. 0.3.0). The tag v<version> must not exist yet.
        type: string
        required: true
      notes:
        description: Release notes in English (markdown, optional). Shown on the release page and in the app when an update is available. Empty means RELEASE_NOTES.md or notes generated from merged PRs.
        type: string
        required: false
        default: ""

# Tên lượt chạy mang tag: job `prepare` dựa vào đó để nhận ra lượt chạy bằng nút đang tạo cùng tag.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release v{0}', inputs.version) || github.ref_type == 'branch' && format('Release from {0}', github.ref_name) || github.ref_name }}

permissions:
  contents: write
  # Đọc danh sách lượt chạy để chặn chạy hai lần cùng một tag (job prepare).
  actions: read
  # Chứng thực nguồn gốc bản dựng (kiểm bằng `gh attestation verify`).
  id-token: write
  attestations: write

# Một lượt phát hành mỗi lúc cho mọi cách kích hoạt: hai lượt song song sẽ tranh nhau tag, `latest` và danh sách tag để
# tính phiên bản. GitHub chỉ giữ một lượt chờ; lượt chờ cũ hơn bị thay bằng lượt mới (với nhánh release thì lượt mới
# đã gồm commit của lượt cũ). Không huỷ lượt đang chạy để bản nháp không bị bỏ dở.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Chuẩn bị tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      previous: ${{ steps.tag.outputs.previous }}
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [ "$EVENT" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
            # Tag có thể vừa được lượt khác tạo trên máy chủ: lấy lại trước khi tính.
            git fetch --tags --force origin
            existing="$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
            if [ -n "$existing" ]; then
              echo "::notice::Commit này đã có tag $existing: bỏ qua, không phát hành lại."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "tag=$existing" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag="v$(scripts/release/version.sh VERSION)"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::error::Tag $tag đã tồn tại trên commit khác. Tăng số trong file VERSION hoặc chạy lại."
              exit 1
            fi
            # Như nhánh dưới: tag do GITHUB_TOKEN tạo không kích hoạt lượt chạy `on: push: tags`, nên không bị chạy đôi.
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            [[ "$INPUT_VERSION" =~ $semver ]] || { echo "::error::Phiên bản phải có dạng x.y.z (vd. 0.3.0), không có chữ v."; exit 1; }
            [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] || { echo "::error::Chỉ phát hành từ nhánh $DEFAULT_BRANCH, đang chọn $GITHUB_REF_NAME."; exit 1; }
            tag="v$INPUT_VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::error::Tag $tag đã tồn tại. Chọn phiên bản mới."
              exit 1
            fi
            # Tag do GITHUB_TOKEN tạo không kích hoạt workflow `on: push: tags` (quy định của GitHub, tránh vòng lặp), nên
            # lượt chạy này là lượt duy nhất cho tag. Nếu sau này đổi sang PAT thì lượt push sẽ tự dừng ở bước kiểm bên dưới.
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          else
            tag="$GITHUB_REF_NAME"
            title="Release $tag"
            running="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=workflow_dispatch&per_page=50" \
              | jq --arg t "$title" '[.workflow_runs[] | select(.display_title == $t and .status != "completed")] | length')"
            if [ "$running" != "0" ]; then
              echo "::notice::Lượt chạy bằng nút đang phát hành $tag: bỏ lượt push này để không chạy hai lần."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          # Tag liền trước (theo số phiên bản) cho dòng Full Changelog.
          previous="$({ git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; echo "$tag"; } | sort -uV | grep -x -B1 -- "$tag" | head -1)"
          [ "$previous" = "$tag" ] && previous=""
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"

  worker:
    name: Worker (goreleaser)
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Chạy bằng nút thì ref là main: goreleaser cần HEAD nằm đúng trên tag.
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum
      - name: Test worker
        working-directory: worker
        run: go test ./...
      - name: Khoá ký checksums.txt
        env:
          WORKER_SIGNING_KEY: ${{ secrets.WORKER_SIGNING_KEY }}
        run: |
          test -n "$WORKER_SIGNING_KEY" || { echo "::error::Thiếu secret WORKER_SIGNING_KEY"; exit 1; }
          umask 077
          printf '%s\n' "$WORKER_SIGNING_KEY" > "$RUNNER_TEMP/worker-signing.key"
          # Secret lệch với khoá công khai trong repo thì mọi worker sẽ từ chối bản này: dừng trước khi dựng.
          openssl ec -in "$RUNNER_TEMP/worker-signing.key" -pubout 2>/dev/null | diff -q - worker/internal/update/release-signing.pem \
            || { echo "::error::WORKER_SIGNING_KEY không khớp worker/internal/update/release-signing.pem"; exit 1; }
          echo "WORKER_SIGNING_KEY_FILE=$RUNNER_TEMP/worker-signing.key" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2.18"
          workdir: worker
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Kiểm bản nháp trước khi công bố
        run: |
          openssl dgst -sha256 -verify worker/internal/update/release-signing.pem \
            -signature worker/dist/checksums.txt.sig worker/dist/checksums.txt
          want="${TAG#v}"
          got="$(worker/dist/hive-worker_linux_amd64_v1/hive-worker version)"
          test "$got" = "$want" || { echo "::error::Binary báo phiên bản $got, tag là $TAG"; exit 1; }
          # `hive version` in "hive <phiên bản>" ở dòng đầu rồi thoát khác 0 khi worker chưa chạy: chỉ đọc dòng đầu.
          got="$(worker/dist/hive_linux_amd64_v1/hive version 2>/dev/null | head -n1 | awk '{print $2}' || true)"
          test "$got" = "$want" || { echo "::error::hive báo phiên bản $got, tag là $TAG"; exit 1; }
          # Cả hai binary phải nằm trong file nén của mọi nền tảng, không thì bản cập nhật tự động bỏ sót hive.
          for archive in worker/dist/*.tar.gz; do
            tar -tzf "$archive" | grep -qx hive || { echo "::error::$archive thiếu hive"; exit 1; }
          done
          for archive in worker/dist/*.zip; do
            unzip -Z1 "$archive" | grep -qx hive.exe || { echo "::error::$archive thiếu hive.exe"; exit 1; }
          done
      - name: Xoá khoá ký
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-signing.key"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            worker/dist/*.tar.gz
            worker/dist/*.zip
            worker/dist/checksums.txt

  desktop:
    name: App desktop
    needs: [prepare, worker]
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      release-tag: ${{ needs.prepare.outputs.tag }}
    # Secret ký macOS (nếu có) đi theo.
    secrets: inherit

  publish:
    name: Công bố
    # Chỉ công bố khi cả worker lẫn app đã nằm đủ trong bản nháp: link /releases/latest không bao giờ thiếu file.
    needs: [prepare, worker, desktop]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS: ${{ needs.prepare.outputs.previous }}
      # Chỉ có khi chạy bằng nút; đi qua biến môi trường để markdown của người nhập không bị shell diễn giải.
      RELEASE_NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - name: Release notes (English)
        # Cùng một nội dung cho trang release và cho `notes` trong latest.json (app hiện khi báo có bản mới). Tag cũ chưa có
        # script thì để trống: thân bài giữ bản nháp do goreleaser sinh.
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          if [ -x scripts/release/notes.sh ]; then
            scripts/release/notes.sh "$TAG" "$PREVIOUS" > "$notes"
          else
            echo "::notice::Tag $TAG chưa có scripts/release/notes.sh: giữ ghi chú của goreleaser."
          fi
          cat "$notes"
      - name: Manifest cập nhật cho app desktop (latest.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Định dạng của tauri-plugin-updater; hub đọc qua HIVE_DESKTOP_RELEASES rồi trả từng nền tảng cho app. Không có
        # chữ ký (repo chưa có khoá) thì bỏ qua: app sẽ không thấy bản mới thay vì nhận bản không ký.
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sig"
          mkdir -p "$dir"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir "$dir" || true
          if ! ls "$dir"/*.sig >/dev/null 2>&1; then echo "::notice::Không có chữ ký cập nhật: bỏ qua latest.json."; exit 0; fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          python3 - "$dir" "$base" "${TAG#v}" "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/latest.json" <<'PY'
          import json, os, sys, datetime
          d, base, version, notes_path = sys.argv[1:5]
          notes = open(notes_path, encoding="utf-8").read().strip()
          files = {
              "darwin-aarch64": "xdev-hive-desktop_macos_arm64.app.tar.gz",
              "linux-x86_64": "xdev-hive-desktop_linux_amd64.AppImage",
              "windows-x86_64": "xdev-hive-desktop_windows_x64-setup.exe",
          }
          platforms = {}
          for key, name in files.items():
              sig = os.path.join(d, name + ".sig")
              if os.path.exists(sig):
                  platforms[key] = {"signature": open(sig).read().strip(), "url": f"{base}/{name}"}
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          print(json.dumps({"version": version, "notes": notes, "pub_date": now, "platforms": platforms}, indent=2))
          PY
          cat "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Công bố bản phát hành
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Thân bài là ghi chú tiếng Anh + Full Changelog + Contributors, cho cả ba cách phát hành. Không có ghi chú (tag cũ
        # chưa có script) thì giữ nguyên bản nháp do goreleaser sinh.
        run: |
          set -euo pipefail
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            body="$RUNNER_TEMP/body.md"
            {
              cat "$RUNNER_TEMP/notes.md"
              printf '\n'
              if [ -n "$PREVIOUS" ]; then printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n\n' "$GITHUB_REPOSITORY" "$PREVIOUS" "$TAG"; fi
              printf '## Contributors\n\n- @tdduydev (Trần Đức Duy)\n- Claude Opus 5.5 (Anthropic): co-author\n'
            } > "$body"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$body"
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
