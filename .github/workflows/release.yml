name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Chứng thực nguồn gốc bản dựng (kiểm bằng `gh attestation verify`).
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker:
    name: Worker (goreleaser)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum
      - name: Test worker
        working-directory: worker
        run: go test ./...
      - name: Khoá ký checksums.txt
        env:
          WORKER_SIGNING_KEY: ${{ secrets.WORKER_SIGNING_KEY }}
        run: |
          test -n "$WORKER_SIGNING_KEY" || { echo "::error::Thiếu secret WORKER_SIGNING_KEY"; exit 1; }
          umask 077
          printf '%s\n' "$WORKER_SIGNING_KEY" > "$RUNNER_TEMP/worker-signing.key"
          # Secret lệch với khoá công khai trong repo thì mọi worker sẽ từ chối bản này: dừng trước khi dựng.
          openssl ec -in "$RUNNER_TEMP/worker-signing.key" -pubout 2>/dev/null | diff -q - worker/internal/update/release-signing.pem \
            || { echo "::error::WORKER_SIGNING_KEY không khớp worker/internal/update/release-signing.pem"; exit 1; }
          echo "WORKER_SIGNING_KEY_FILE=$RUNNER_TEMP/worker-signing.key" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2.18"
          workdir: worker
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Kiểm bản nháp trước khi công bố
        run: |
          openssl dgst -sha256 -verify worker/internal/update/release-signing.pem \
            -signature worker/dist/checksums.txt.sig worker/dist/checksums.txt
          tag="${GITHUB_REF_NAME#v}"
          got="$(worker/dist/hive-worker_linux_amd64_v1/hive-worker version)"
          test "$got" = "$tag" || { echo "::error::Binary báo phiên bản $got, tag là $tag"; exit 1; }
      - name: Xoá khoá ký
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-signing.key"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            worker/dist/*.tar.gz
            worker/dist/*.zip
            worker/dist/checksums.txt

  desktop:
    name: App desktop
    needs: worker
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.worker.outputs.version }}
      release-tag: ${{ github.ref_name }}
    # Secret ký macOS (nếu có) đi theo.
    secrets: inherit

  publish:
    name: Công bố
    # Chỉ công bố khi cả worker lẫn app đã nằm đủ trong bản nháp: link /releases/latest không bao giờ thiếu file.
    needs: [worker, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Manifest cập nhật cho app desktop (latest.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Định dạng của tauri-plugin-updater; hub đọc qua HIVE_DESKTOP_RELEASES rồi trả từng nền tảng cho app. Không có
        # chữ ký (repo chưa có khoá) thì bỏ qua: app sẽ không thấy bản mới thay vì nhận bản không ký.
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sig"
          mkdir -p "$dir"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir "$dir" || true
          if ! ls "$dir"/*.sig >/dev/null 2>&1; then echo "::notice::Không có chữ ký cập nhật: bỏ qua latest.json."; exit 0; fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          python3 - "$dir" "$base" "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/latest.json" <<'PY'
          import json, os, sys, datetime
          d, base, version = sys.argv[1:4]
          files = {
              "darwin-aarch64": "xdev-hive-desktop_macos_arm64.app.tar.gz",
              "linux-x86_64": "xdev-hive-desktop_linux_amd64.AppImage",
              "windows-x86_64": "xdev-hive-desktop_windows_x64-setup.exe",
          }
          platforms = {}
          for key, name in files.items():
              sig = os.path.join(d, name + ".sig")
              if os.path.exists(sig):
                  platforms[key] = {"signature": open(sig).read().strip(), "url": f"{base}/{name}"}
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          print(json.dumps({"version": version, "notes": "", "pub_date": now, "platforms": platforms}, indent=2))
          PY
          cat "$RUNNER_TEMP/latest.json"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/latest.json" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Công bố bản phát hành
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
